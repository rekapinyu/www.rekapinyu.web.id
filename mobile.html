.summary{padding:12px 14px 13px;border-top:1px solid #f0f1f1}.sumrow{display:flex;justify-content:space-between;color:#747b79;font-size:10px;margin:0 0 9px}.sumrow.total{color:#171b19;font-size:11px;font-weight:700;margin:13px 0 0}.promo{display:flex;gap:7px;margin-top:14px}.promo input{min-width:0;flex:1;border:1px solid #eff0f0;border-radius:7px;padding:8px 10px}.promo button{border:1px solid #eff0f0;border-radius:7px;background:#fff;color:#6e7473;padding:0 12px}.payment{width:100%;border:1px solid #eff0f0;background:#fff;border-radius:7px;padding:8px 10px;margin-top:9px;color:#737977;text-align:left}.placeorder{width:100%;border:1px solid #087c62;background:var(--green);color:#fff;border-radius:7px;padding:9px;margin-top:10px;font-weight:600;box-shadow:0 2px 3px #008d6b24}.placeorder:hover{background:var(--green-dark)}
.empty{padding:30px 8px;text-align:center;color:#9ba19f;font-size:11px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18201e;color:#fff;border-radius:9px;padding:11px 16px;box-shadow:0 8px 30px #0002;display:none;z-index:10}

@media(max-width:720px){body{background:#f5f7f6}.stage{padding:0;display:block}.browser{width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}.browserbar{display:none;height:0}.app{grid-template-columns:48px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}.sidebar{grid-row:1 / 3;padding:9px 0;gap:9px}.logo,.navbtn,.avatar{width:34px;height:34px}.logo{font-size:19px;margin-bottom:7px}.navbtn{font-size:17px}.main{padding:13px 10px;overflow:hidden}.mainhead{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:12px}.mainhead h1{font-size:16px}.searchrow{width:100%}.search{width:auto;max-width:none;flex:1}.categories{display:flex;overflow-x:auto;padding-bottom:3px;margin-right:-10px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.category{min-width:78px;min-height:78px}.category .food{font-size:25px;line-height:29px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.productpic{height:105px}.sushi{font-size:55px}.productbody{padding:8px}.productname{font-size:11px}.order{grid-column:2;max-height:47vh;border-left:0;border-top:1px solid #e9ecea;overflow:hidden}.orderhead{padding:10px 12px}.orderhead h2{font-size:14px}.orderselectors{padding:7px 10px}.itemshead{padding:9px 11px 6px}.cartitems{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 8px;overflow:auto}.cartitem{margin:0;padding:7px}.cartpic{width:31px;height:31px;font-size:20px}.cartname{font-size:9px}.cartdesc{font-size:8px}.cartbottom{margin-top:6px}.qty{gap:4px}.qty button{width:20px;height:20px}.summary{padding:8px 10px}.sumrow{margin-bottom:5px}.sumrow.total{margin-top:7px}.promo{margin-top:8px}.promo input,.promo button,.payment{padding:7px}.placeorder{padding:8px;margin-top:7px}}

/* Viewport-fit fix: preserve the current design, avoid hiding content below the screen */

/* Sidebar stays in the layout grid, with its own independent scroll area */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  overscroll-behavior-y: contain;
  scrollbar-width: none;
  -ms-overflow-style: none;
  z-index: 5;
}
.sidebar::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
.sidebar > * { flex-shrink: 0; }
.sidebar .navspacer { flex: 0 0 12px; min-height: 12px; }

@media (max-width: 900px) {
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
    max-height: 100vh;
    max-height: 100dvh;
    width: 52px;
    align-self: start;
    overflow-y: auto;
  }
}
@media (max-width: 720px) {

    width: 48px;
    padding-top: 9px;
    padding-bottom: 9px;
    grid-row: 1 / 3;
  }
}

  .sidebar { width: 42px; }
}

/* Landscape-only mobile/tablet mode: keep the existing layout unchanged in landscape */

    justify-content: center;

}

/* Align logo box at the top-left; Bluetooth box starts directly beside it */
@media screen and (orientation: landscape) and (max-width: 1100px) {
  .app {
    grid-template-columns: 50px minmax(0,1fr) !important;
    grid-template-rows: minmax(0,1fr) !important;
  }

    border-right: 1px solid #edf0ef !important;
    box-sizing: border-box !important;
  }
  .sidebar .mobile-brand {
    width: 100% !important;
    box-sizing: border-box !important;

</head>
<body>
<div class="stage">
 <div class="browser">
  <div class="browserbar"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i><span class="browsericon">▣</span><span style="margin-left:8px">‹</span><span>›</span><div class="address">♙ https://sushiban/dashboard/order.com</div><span>⟳</span><span>⇧</span><span>＋</span><span>▢</span></div>
  <div class="app">
   <aside class="sidebar">
    <div class="mobile-brand">💧</div>
    <div class="mobile-nav"><button title="Kasir">▧</button><button title="Produk">♜</button><button title="Laporan">▣</button><button title="Pengaturan">☷</button></div>
    <div class="logo">🍣</div>
    <button class="navbtn" title="Home">⌂</button><button class="navbtn active" title="Products">▦</button><button class="navbtn" title="Orders">▤</button><button class="navbtn" title="Customers">♧</button><button class="navbtn" title="Inventory">⬡</button><button class="navbtn" title="Reports">▥</button>
    <div class="navspacer"></div><button class="navbtn" title="Notifications">♟</button><button class="navbtn" title="Settings">⚙</button><div class="avatar">👩🏻</div>
   </aside>
   <main class="main">
    <div class="mobile-toolbar"><button class="mobile-bluetooth" title="Bluetooth">ᛒ</button><button class="mobile-shift" id="shiftMobile">SHIFT</button><input id="mobileSearch" placeholder="cari produk" aria-label="Cari produk"><input id="mobileBarcode" placeholder="barcode" aria-label="Barcode"></div>
    <div class="mainhead"><h1>Time to Sushi!</h1><div class="searchrow"><input class="search" id="search" placeholder="⌕  Search sushi..." aria-label="Search products"><button class="filter" id="filterBtn">▽ &nbsp;Filter</button></div></div>
    <div class="categories" id="categories"></div>
    <div class="products" id="products"></div>
   </main>
   <aside class="order">
    <div class="orderhead"><h2>Order Details</h2><button class="more" title="More options">···</button></div>
    <div class="orderselectors"><select aria-label="Order type"><option>Dine In</option><option>Take Away</option><option>Delivery</option></select><select aria-label="Table"><option>Table 21</option><option>Table 01</option><option>Table 02</option><option>Table 03</option><option>Table 04</option></select></div>
    <div class="itemshead"><strong>Items</strong><button class="clear" id="clear">▤ &nbsp;Clear All</button></div>
    <div class="cartitems" id="cart"></div>
    <div class="summary">
     <div class="sumrow"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
     <div class="sumrow"><span>Tax (10%)</span><span id="tax">$0.00</span></div>
     <div class="sumrow"><span>Discount</span><span id="discount">$0.00</span></div>
     <div class="sumrow total"><span>Total</span><span id="total">$0.00</span></div>
     <div class="promo"><input id="promo" placeholder="Enter promo code..."><button id="apply">Apply</button></div>
     <select class="payment" id="payment"><option value="">Select payment method</option><option>Cash</option><option>Credit / Debit Card</option><option>E-Wallet</option></select>
     <button class="placeorder" id="place">Place Order</button>
    </div>
   </aside>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
const categories=[
 {name:'Nigiri Sushi',icon:'🍣'},{name:'Maki Sushi',icon:'🍙'},{name:'Uramaki Sushi',icon:'🍘'},{name:'Gunkan Maki',icon:'🍱'},{name:'Temaki Sushi',icon:'🥗'},{name:'Oshi Sushi',icon:'🍣'},{name:'Chirashi Sushi',icon:'🍛'}
];
const products=[
 {id:1,name:'Salmori Sushi',category:'Nigiri Sushi',desc:'4 pcs/pack',price:10,icon:'🍣'},
 {id:2,name:'Nori Glaze Salmon Sushi',category:'Maki Sushi',desc:'6 pcs/pack',price:11,icon:'🍙'},
 {id:3,name:'Sweet Shrimp Sushi',category:'Nigiri Sushi',desc:'4 pcs/pack',price:12,icon:'🍤'},
 {id:4,name:'Umami Gyuniku Sushi',category:'Nigiri Sushi',desc:'2 pcs/pack',price:13.5,icon:'🍣'},
 {id:5,name:'Tamago Ikura Sushi',category:'Nigiri Sushi',desc:'4 pcs/pack',price:11.5,icon:'🍳'},
 {id:6,name:'Maguro Wasabi Sushi',category:'Nigiri Sushi',desc:'8 pcs/pack',price:12,icon:'🍣'},
 {id:7,name:'Nori Pop Sushi',category:'Gunkan Maki',desc:'4 pcs/pack',price:11,icon:'🍱'},
 {id:8,name:'Shrimp Wrap Sushi',category:'Maki Sushi',desc:'6 pcs/pack',price:12.5,icon:'🍤'},
 {id:9,name:'Avocado Maki',category:'Maki Sushi',desc:'6 pcs/pack',price:9.5,icon:'🥑'},
 {id:10,name:'Salmon Roll',category:'Uramaki Sushi',desc:'6 pcs/pack',price:13,icon:'🍥'},
 {id:11,name:'Tuna Temaki',category:'Temaki Sushi',desc:'2 pcs/pack',price:10.5,icon:'🌮'},
 {id:12,name:'Oshi Salmon',category:'Oshi Sushi',desc:'4 pcs/pack',price:14,icon:'🍣'},
 {id:13,name:'Chirashi Bowl',category:'Chirashi Sushi',desc:'1 bowl',price:16,icon:'🍚'},
 {id:14,name:'Salmon Ikura',category:'Gunkan Maki',desc:'4 pcs/pack',price:12.5,icon:'🍱'}
];
let activeCategory='Nigiri Sushi',cart=new Map(),discount=0;
const money=n=>'$'+n.toFixed(2);
function renderCategories(){document.getElementById('categories').innerHTML=categories.map(c=>`<button class="category ${activeCategory===c.name?'active':''}" data-cat="${c.name}"><span class="food">${c.icon}</span><span>${c.name}</span></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();renderProducts()})}
function renderProducts(){let q=(document.getElementById('mobileSearch')?.value||document.getElementById('search').value).toLowerCase();let filtered=products.filter(p=>(activeCategory==='All'||p.category===activeCategory)&&p.name.toLowerCase().includes(q));if(!filtered.length)filtered=products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('products').innerHTML=filtered.map(p=>`<article class="product"><div class="productpic"><span class="sushi">${p.icon}</span></div><div class="productbody"><div class="productname" title="${p.name}">${p.name}</div><div class="inventory-state"><span>Stok Manual<br><b>${p.stockManual??90}</b></span><span>Stok Barcode<br><b>${p.stockBarcode??0}</b></span></div><div class="inventory-price"><span>Harga Beli<br><b>${money(p.cost??p.price*.8)}</b></span></div><div class="inventory-price sell"><span>Harga Jual<br><b>${money(p.price)}</b></span></div><button class="add" data-add="${p.id}">＋ &nbsp;Add to cart</button></div></article>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(+b.dataset.add))}
function addToCart(id){cart.set(id,(cart.get(id)||0)+1);renderCart();toast('Added to cart')}
function changeQty(id,delta){let n=(cart.get(id)||0)+delta;if(n<=0)cart.delete(id);else cart.set(id,n);renderCart()}
function renderCart(){let entries=[...cart.entries()];document.getElementById('cart').innerHTML=entries.length?entries.map(([id,qty])=>{let p=products.find(x=>x.id===id);return `<div class="cartitem"><div class="carttop"><div class="cartpic">${p.icon}</div><div><div class="cartname">${p.name}</div><div class="cartdesc">${p.category}<br>${p.desc}</div></div></div><div class="cartbottom"><span class="cartprice">${money(p.price*qty)}</span><div class="qty"><button data-minus="${id}">−</button><span class="qtynum">${qty}</span><button class="plus" data-plus="${id}">＋</button></div></div></div>`}).join(''):'<div class="empty">Your order is empty.<br>Add sushi to get started.</div>';document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(+b.dataset.minus,-1));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(+b.dataset.plus,1));let subtotal=entries.reduce((s,[id,q])=>s+products.find(p=>p.id===id).price*q,0),tax=subtotal*.1,total=Math.max(0,subtotal+tax-discount);document.getElementById('subtotal').textContent=money(subtotal);document.getElementById('tax').textContent=money(tax);document.getElementById('discount').textContent=money(discount);document.getElementById('total').textContent=money(total)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2200)}
document.getElementById('search').addEventListener('input',renderProducts);
document.getElementById('mobileSearch')?.addEventListener('input',renderProducts);
document.getElementById('clear').onclick=()=>{cart.clear();discount=0;renderCart();toast('Order cleared')};
document.getElementById('apply').onclick=()=>{let code=document.getElementById('promo').value.trim().toUpperCase();let subtotal=[...cart.entries()].reduce((s,[id,q])=>s+products.find(p=>p.id===id).price*q,0);if(code==='SUSHI10'&&subtotal>0){discount=subtotal*.1;renderCart();toast('10% discount applied')}else{discount=0;renderCart();toast('Use code SUSHI10 for 10% off')}};
document.getElementById('filterBtn').onclick=()=>{activeCategory=activeCategory==='All'?'Nigiri Sushi':'All';renderCategories();renderProducts();toast(activeCategory==='All'?'Showing all categories':'Showing Nigiri Sushi')};
document.getElementById('place').onclick=()=>{if(!cart.size){toast('Please add items to your order');return}if(!document.getElementById('payment').value){toast('Please select a payment method');return}toast('Order placed successfully!');cart.clear();discount=0;document.getElementById('promo').value='';renderCart()};
document.getElementById('mobileSearch').addEventListener('input',e=>{document.getElementById('search').value=e.target.value;renderProducts()});
document.getElementById('mobileBarcode').addEventListener('keydown',e=>{if(e.key==='Enter'){const p=products.find(x=>String(x.id)===e.target.value.trim());if(p){addToCart(p.id);e.target.value=''}else toast('Barcode tidak ditemukan')}});
document.getElementById('shiftMobile').onclick=()=>toast('SHIFT');
renderCategories();renderProducts();cart.set(6,1);cart.set(5,1);renderCart();
</script>
</body>
</html>
