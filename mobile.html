<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0">
<title>Sushi POS — Cashier</title>
<style>
:root{--green:#0aa883;--green-dark:#078b6d;--mint:#e5f5f1;--ink:#17191b;--muted:#858b8a;--line:#eceeed;--bg:#f3f5f4}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:12px}
button,input,select{font:inherit}button{cursor:pointer}
.stage{min-height:100vh;display:block;padding:0}
.browser{width:100%;height:100vh;min-height:650px;background:#fff;border-radius:0;overflow:hidden;box-shadow:none;display:flex;flex-direction:column}
.browserbar{display:none}
.dot{height:8px;width:8px;border-radius:50%;display:inline-block}.red{background:#fa6a63}.yellow{background:#f5c24e}.green{background:#51c65d}.browsericon{margin-left:12px;font-size:14px}.address{margin:auto;background:#0c0d0f;border-radius:6px;width:42%;padding:5px;text-align:center;font-size:10px;color:#c5c8c8}
.app{display:grid;grid-template-columns:66px minmax(0,1fr) 310px;min-height:0;flex:1}
.sidebar{border-right:1px solid #f1f2f2;display:flex;flex-direction:column;align-items:center;padding:13px 0 12px;gap:11px;background:#fff}
.logo{width:39px;height:39px;background:var(--green);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.navbtn{width:39px;height:39px;border:1px solid #f1f2f2;border-radius:11px;background:#fff;color:#a9afad;display:grid;place-items:center;font-size:19px;box-shadow:0 1px 2px #00000005}
.navbtn.active{background:#e6f6f2;border-color:#e6f6f2;color:var(--green)}.navspacer{flex:1}
.avatar{width:39px;height:39px;border-radius:11px;background:#e4f5f0;display:grid;place-items:center;font-size:22px}
.main{padding:18px 18px 16px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.mainhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.mainhead h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.4px}
.searchrow{display:flex;gap:8px}.search{width:220px;max-width:26vw;border:1px solid #eff0f0;border-radius:7px;padding:8px 10px;outline:none}.filter{border:1px solid #eff0f0;background:#fff;border-radius:7px;padding:8px 12px;color:#5f6665}
.categories{display:grid;grid-template-columns:repeat(7,minmax(68px,1fr));gap:9px;margin-bottom:14px}
.category{border:1px solid #f0f1f1;border-radius:13px;background:#fff;min-width:0;padding:9px 4px 10px;text-align:center;color:#666d6b;display:flex;align-items:center;flex-direction:column;gap:7px;min-height:91px}
.category .food{font-size:28px;line-height:34px;filter:drop-shadow(0 3px 2px #00000012)}.category span:last-child{font-size:10px;white-space:nowrap}
.category.active{background:#e5f4f0;border-color:#e5f4f0;color:#171b19}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;overflow:auto;padding:0 0 2px;align-content:start}
.product{border:1px solid #eceeee;border-radius:13px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0;box-shadow:0 2px 4px #00000003}
.productpic{height:125px;background:linear-gradient(145deg,#fff,#fbfcfb);display:grid;place-items:center;border-bottom:1px solid #f3f3f3;position:relative;overflow:hidden}
.productpic:after{content:"";position:absolute;bottom:18px;width:66%;height:14px;border-radius:50%;background:#b7b5a83b;filter:blur(7px)}
.sushi{font-size:69px;z-index:1;filter:drop-shadow(0 5px 3px #00000017);transform:rotate(-7deg)}
.productbody{padding:9px 9px 8px;display:flex;flex-direction:column;flex:1;gap:7px}.productname{font-size:11px;font-weight:650;line-height:1.35;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.productmeta{display:flex;justify-content:space-between;align-items:center;gap:4px;color:#7b8280;font-size:10px}.price{color:var(--green-dark);font-weight:650;font-size:11px;white-space:nowrap}
.add{border:0;background:#e5f5f1;color:#0b9979;border-radius:7px;padding:7px 5px;margin-top:auto}.add:hover{background:#c9eee4}
.order{border-left:1px solid #eef0ef;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.orderhead{padding:17px 15px 13px;border-bottom:1px solid #f0f1f1;display:flex;justify-content:space-between;align-items:center}.orderhead h2{font-size:16px;margin:0;font-weight:650}.more{border:1px solid #f0f1f1;border-radius:7px;background:white;color:#8a908f;width:28px;height:28px}
.orderselectors{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 13px;border-bottom:1px solid #f1f2f2}.orderselectors select{min-width:0;width:100%;border:1px solid #f0f1f1;background:white;border-radius:7px;padding:8px;color:#727977}
.itemshead{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 9px}.itemshead strong{font-size:13px}.clear{border:0;background:transparent;color:#c44949;font-size:10px}
.cartitems{padding:0 11px;overflow:auto;flex:1;min-height:80px}.cartitem{border:1px solid #eceeee;border-radius:10px;margin-bottom:10px;padding:10px 9px 8px}.carttop{display:flex;gap:9px;align-items:center}.cartpic{width:42px;height:42px;border:1px solid #f0f0f0;border-radius:7px;display:grid;place-items:center;font-size:26px;flex-shrink:0}.cartname{font-size:10px;font-weight:650;margin-bottom:4px}.cartdesc{font-size:9px;color:#8b908f;line-height:1.4}.cartbottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.cartprice{font-weight:650;color:var(--green-dark);font-size:11px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:23px;height:23px;border:1px solid #f0f1f1;border-radius:6px;background:#fff;color:#777;font-size:15px;line-height:1}.qty .plus{background:var(--green);border-color:var(--green-dark);color:#fff}.qtynum{min-width:8px;text-align:center}
.summary{padding:12px 14px 13px;border-top:1px solid #f0f1f1}.sumrow{display:flex;justify-content:space-between;color:#747b79;font-size:10px;margin:0 0 9px}.sumrow.total{color:#171b19;font-size:11px;font-weight:700;margin:13px 0 0}.promo{display:flex;gap:7px;margin-top:14px}.promo input{min-width:0;flex:1;border:1px solid #eff0f0;border-radius:7px;padding:8px 10px}.promo button{border:1px solid #eff0f0;border-radius:7px;background:#fff;color:#6e7473;padding:0 12px}.payment{width:100%;border:1px solid #eff0f0;background:#fff;border-radius:7px;padding:8px 10px;margin-top:9px;color:#737977;text-align:left}.placeorder{width:100%;border:1px solid #087c62;background:var(--green);color:#fff;border-radius:7px;padding:9px;margin-top:10px;font-weight:600;box-shadow:0 2px 3px #008d6b24}.placeorder:hover{background:var(--green-dark)}
.empty{padding:30px 8px;text-align:center;color:#9ba19f;font-size:11px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18201e;color:#fff;border-radius:9px;padding:11px 16px;box-shadow:0 8px 30px #0002;display:none;z-index:10}
/* Desktop rule retained exactly; all responsive rules below are consolidated. */
@media (min-width: 1101px) {
  .browser { width: min(1400px, 100%); height: min(880px, calc(100vh - 64px)); }
  .app { grid-template-columns: 66px minmax(0,1fr) 310px; }
  .products { grid-template-columns: repeat(4, minmax(0,1fr)); }
}

/* Shared rules retained from the original file so desktop behavior remains unchanged. */
html { min-height: 100%; scroll-behavior: smooth; }
body { min-height: 100%; }
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh;
  min-height: 0; overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior-y: contain;
  scrollbar-width: none; -ms-overflow-style: none; z-index: 5;
}
.sidebar::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
.sidebar > * { flex-shrink: 0; }
.sidebar .navspacer { flex: 0 0 12px; min-height: 12px; }
.inventory-state, .inventory-price { display: none; }

/* Default: mobile-only controls are not shown on desktop. */
.mobile-brand, .mobile-nav, .mobile-toolbar, .mobile-logout { display: none; }

/* Portrait lock for phone/tablet widths. */
@media screen and (orientation: portrait) and (max-width: 1100px) {
  body { overflow: hidden !important; }
  body::after {
    content: "Putar perangkat ke posisi horizontal (landscape) untuk menggunakan kasir";
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: #f5f7f6;
    color: #17191b;
    text-align: center;
    font: 600 17px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
}

/* One responsive layout for landscape phones and tablets. */
@media screen and (orientation: landscape) and (max-width: 1100px) {
  html, body { width: 100%; height: 100%; min-height: 0; margin: 0; overflow: hidden; }
  .stage { display: block; width: 100%; height: 100dvh; min-height: 0; padding: 0; }
  .browser { display: flex; width: 100%; height: 100dvh; min-height: 0; max-height: none; border-radius: 0; overflow: hidden; box-shadow: none; }
  .browserbar { display: none !important; }
  .app {
    position: relative;
    display: grid !important;
    grid-template-columns: 50px minmax(0, 1fr) !important;
    grid-template-rows: minmax(0, 1fr) !important;
    flex: 1 1 auto;
    width: 100%; height: 100dvh; min-height: 0; overflow: hidden;
  }

  /* Sidebar: top logo cell and one continuous right-hand divider. */
  .sidebar {
    grid-column: 1 !important; grid-row: 1 !important;
    position: relative !important; top: auto !important; align-self: stretch !important;
    display: flex !important; flex-direction: column !important; align-items: center !important;
    gap: 0 !important; width: 50px !important; height: 100dvh !important;
    max-height: 100dvh !important; min-height: 0 !important; margin: 0 !important;
    padding: 0 0 8px !important; overflow-x: hidden !important; overflow-y: auto !important;
    border-right: 1px solid #e5e9ec !important; background: #fff !important;
    box-sizing: border-box !important; scrollbar-width: none !important;
    -ms-overflow-style: none !important; z-index: 1001 !important;
  }
  .sidebar::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  .sidebar > * { flex-shrink: 0; }
  .sidebar .mobile-brand {
    display: flex !important; align-items: center !important; justify-content: center !important;
    flex: 0 0 52px !important; width: 100% !important; height: 52px !important; min-height: 52px !important;
    margin: 0 !important; padding: 0 !important; border: 0 !important;
    border-bottom: 1px solid #e9edef !important; border-radius: 0 !important;
    background: #fff !important; box-sizing: border-box !important; font-size: 0 !important;
    overflow: hidden !important; text-align: center !important;
  }
  .sidebar .mobile-brand img {
    display: block !important; flex: 0 0 auto !important;
    width: 38px !important; height: 38px !important; max-width: calc(100% - 6px) !important; max-height: 40px !important;
    object-fit: contain !important; object-position: 50% 50% !important;
    margin: 0 auto !important; padding: 0 !important; border: 0 !important;
  }
  .sidebar .mobile-nav {
    display: flex !important; flex: 0 0 auto !important; flex-direction: column !important;
    align-items: center !important; gap: 8px !important; width: 100% !important;
    margin: 0 !important; padding: 8px 0 !important; box-sizing: border-box !important;
  }
  .sidebar .mobile-nav button {
    display: grid !important; place-items: center !important; flex: 0 0 39px !important;
    width: 39px !important; height: 39px !important; margin: 0 !important; padding: 0 !important;
    border: 1px solid #edf0f4 !important; border-radius: 10px !important;
    background: #fff !important; color: #5887ed !important; font-size: 17px !important;
    box-shadow: 0 1px 2px #00000005 !important;
  }
  .sidebar .mobile-nav .material-symbols-rounded {
    display: block !important;
    font-family: "Material Symbols Rounded" !important;
    font-weight: 300 !important;
    font-style: normal !important;
    font-size: 21px !important;
    line-height: 1 !important;
    letter-spacing: normal !important;
    text-transform: none !important;
    white-space: nowrap !important;
    word-wrap: normal !important;
    direction: ltr !important;
    font-feature-settings: "liga" !important;
    -webkit-font-feature-settings: "liga" !important;
    -webkit-font-smoothing: antialiased !important;
    pointer-events: none !important;
  }
  /* Separate logout control stays at the bottom of the mobile sidebar. */
  .sidebar .mobile-logout {
    display: grid !important; place-items: center !important;
    flex: 0 0 39px !important; width: 39px !important; height: 39px !important;
    margin: auto 0 0 !important; padding: 0 !important;
    border: 1px solid #fee2e2 !important; border-radius: 10px !important;
    background: #fff !important; color: #dc2626 !important;
    box-shadow: 0 1px 2px #00000005 !important;
    cursor: pointer !important; -webkit-tap-highlight-color: transparent;
    transition: background-color .18s ease, border-color .18s ease, color .18s ease !important;
  }
  .sidebar .mobile-logout:hover,
  .sidebar .mobile-logout:active {
    background: #fee2e2 !important; border-color: #fecaca !important; color: #b91c1c !important;
  }
  .sidebar .mobile-logout .material-symbols-rounded {
    display: block !important; font-family: "Material Symbols Rounded" !important;
    font-size: 21px !important; font-weight: 300 !important; line-height: 1 !important;
    font-feature-settings: "liga" !important; -webkit-font-feature-settings: "liga" !important;
    -webkit-font-smoothing: antialiased !important; pointer-events: none !important;
  }
  .sidebar > .logo, .sidebar > .navbtn, .sidebar > .navspacer, .sidebar > .avatar { display: none !important; }

  /* Fixed header starts exactly at the sidebar's right edge. */
  .mobile-toolbar {
    position: fixed !important; z-index: 1000 !important; top: 0 !important;
    left: 50px !important; right: 0 !important; width: calc(100% - 50px) !important;
    height: 52px !important; min-height: 52px !important; display: flex !important;
    align-items: center !important; flex-wrap: nowrap !important; gap: 8px !important;
    margin: 0 !important; padding: 6px 8px !important; border: 0 !important;
    border-bottom: 1px solid #e9edef !important; border-radius: 0 !important;
    background: #fff !important; box-sizing: border-box !important;
  }
  .mobile-toolbar::before { display: none !important; content: none !important; }
  .mobile-toolbar button, .mobile-toolbar input {
    flex-shrink: 1; min-width: 0 !important; height: 36px !important; margin: 0 !important;
    border: 1px solid #e7e9e9 !important; border-radius: 8px !important;
    background: #fff !important; color: #333 !important; box-sizing: border-box !important;
    font-size: 12px !important;
  }
  .mobile-toolbar .mobile-bluetooth { flex: 0 0 34px !important; width: 34px !important; padding: 0 !important; color: #e65a73 !important; display:grid !important; place-items:center !important; cursor:pointer !important; transition:background .18s ease,border-color .18s ease,color .18s ease,opacity .18s ease !important; }
  .mobile-toolbar .mobile-bluetooth .material-symbols-rounded { font-family:"Material Symbols Rounded" !important; font-size:19px !important; line-height:1 !important; font-weight:400 !important; font-feature-settings:"liga" !important; pointer-events:none !important; }
  .mobile-toolbar .mobile-bluetooth.is-scanning { background:#fef3c7 !important; border-color:#f59e0b !important; color:#92400e !important; }
  .mobile-toolbar .mobile-bluetooth.is-connected { background:#dcfce7 !important; border-color:#86efac !important; color:#15803d !important; }
  .mobile-toolbar .mobile-bluetooth.is-error { background:#fff1f2 !important; border-color:#fda4af !important; color:#be123c !important; }
  .mobile-toolbar .mobile-bluetooth:disabled { opacity:.72 !important; cursor:progress !important; }
  .mobile-toolbar .mobile-shift { flex: 0 0 84px !important; width: 84px !important; padding: 0 8px !important; font-weight: 600 !important; white-space: nowrap !important; }
  .mobile-toolbar #mobileSearch, .mobile-toolbar #mobileBarcode { flex: 1 1 0 !important; width: 0 !important; padding: 0 10px !important; }

  .main {
    grid-column: 2 !important; grid-row: 1 !important; display: block !important;
    width: 100%; min-width: 0 !important; height: 100dvh !important;
    margin: 0 !important; padding: 62px 8px 8px !important;
    overflow-x: hidden !important; overflow-y: auto !important; box-sizing: border-box !important;
  }
  .mainhead, .categories, .order { display: none !important; }

  /* Four compact stock cards per row. */
  .products {
    display: grid !important; width: 100% !important;
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    grid-auto-rows: max-content !important; align-content: start !important; align-items: stretch !important;
    gap: 7px !important; margin: 0 !important; padding: 0 0 8px !important;
    overflow: visible !important; box-sizing: border-box !important;
  }
  .product {
    display: flex !important; flex-direction: column !important; width: 100% !important;
    min-width: 0 !important; height: auto !important; margin: 0 !important; padding: 6px !important;
    border: 1px solid #dce5ee !important; border-radius: 10px !important;
    background: #fff !important; box-shadow: none !important; box-sizing: border-box !important;
    overflow: hidden !important;
  }
  .productpic {
    display: grid !important; place-items: center !important; flex: 0 0 auto !important;
    width: 100% !important; height: clamp(70px, 14vh, 96px) !important; border: 0 !important;
    border-radius: 8px !important; background: #fff !important; overflow: hidden !important;
  }
  .productpic::after { display: none !important; }
  .sushi { font-size: clamp(34px, 6vh, 48px) !important; line-height: 1 !important; transform: none !important; }
  .productbody {
    display: flex !important; flex: 1 1 auto !important; flex-direction: column !important;
    gap: 4px !important; width: 100% !important; min-width: 0 !important;
    padding: 4px 1px 1px !important; box-sizing: border-box !important;
  }
  .productname {
    display: block !important; width: 100% !important; min-width: 0 !important;
    min-height: 13px !important; margin: 0 !important; font-size: 9px !important;
    line-height: 1.25 !important; font-weight: 700 !important; white-space: nowrap !important;
    overflow: hidden !important; text-overflow: ellipsis !important;
  }
  .productmeta, .add { display: none !important; }
  .inventory-state {
    display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 4px !important; width: 100% !important;
  }
  .inventory-state span, .inventory-price span {
    display: block !important; width: 100% !important; min-width: 0 !important; padding: 4px !important;
    border: 1px solid #b9eacb !important; border-radius: 7px !important;
    font-size: 7px !important; line-height: 1.25 !important; box-sizing: border-box !important;
    overflow-wrap: anywhere !important;
  }
  .inventory-state span:first-child { background: #fff8ef !important; border-color: #ffd6a8 !important; }
  .inventory-state span:last-child { background: #effbf3 !important; border-color: #b9eacb !important; }
  .inventory-state b, .inventory-price b {
    display: block !important; margin-top: 3px !important; font-size: 8px !important;
    line-height: 1.15 !important; font-weight: 600 !important;
  }
  .inventory-state span:first-child b { color: #e05d13 !important; }
  .inventory-state span:last-child b { color: #078b6d !important; }
  .inventory-price { display: block !important; width: 100% !important; }
  .inventory-price span { background: #eff6ff !important; border-color: #c8ddff !important; color: #8293a9 !important; }
  .inventory-price b { color: #1756c7 !important; }
  .inventory-price.sell span { background: #effbf3 !important; border-color: #bcebc9 !important; }
  .inventory-price.sell b { color: #07936c !important; }
}

/* Narrow landscape phones: compact controls and cards without changing desktop. */
@media screen and (orientation: landscape) and (max-width: 600px) {
  .app { grid-template-columns: 44px minmax(0, 1fr) !important; }
  .sidebar { width: 44px !important; }
  .sidebar .mobile-brand { flex-basis: 48px !important; height: 48px !important; min-height: 48px !important; }
  .sidebar .mobile-brand img { width: 34px !important; height: 34px !important; max-height: 34px !important; }
  .sidebar .mobile-nav button { flex-basis: 35px !important; width: 35px !important; height: 35px !important; }
  .sidebar .mobile-logout { flex-basis: 35px !important; width: 35px !important; height: 35px !important; border-radius: 9px !important; }
  .sidebar .mobile-logout .material-symbols-rounded { font-size: 19px !important; }
  .mobile-toolbar { left: 44px !important; width: calc(100% - 44px) !important; height: 48px !important; min-height: 48px !important; gap: 5px !important; padding: 5px !important; }
  .mobile-toolbar .mobile-bluetooth { flex-basis: 30px !important; width: 30px !important; }
  .mobile-toolbar .mobile-shift { flex-basis: 62px !important; width: 62px !important; }
  .mobile-toolbar #mobileSearch, .mobile-toolbar #mobileBarcode { padding: 0 6px !important; font-size: 11px !important; }
  .main { padding: 56px 6px 8px !important; }
  .products { gap: 5px !important; }
  .product { padding: 4px !important; }
  .productpic { height: clamp(56px, 12vh, 76px) !important; }
  .productname { font-size: 8px !important; }
  .inventory-state { gap: 3px !important; }
  .inventory-state span, .inventory-price span { padding: 3px 2px !important; font-size: 6px !important; }
  .inventory-state b, .inventory-price b { font-size: 7px !important; }
}



/* Mobile landscape cart drawer — screenshot-matched item rows and fixed footer. */
.cart-drawer-backdrop { display:none; }
.cart-fab { display:none; }
.cart-drawer-actions { display:none; }
@media screen and (orientation:landscape) and (max-width:1100px) {
  .cart-fab {
    position:fixed; right:max(15px, env(safe-area-inset-right)); bottom:max(15px, env(safe-area-inset-bottom));
    z-index:1090; display:grid; place-items:center; width:58px; height:58px; padding:0;
    border:0; border-radius:50%; background:#2563eb; color:#fff;
    box-shadow:0 7px 20px rgba(37,99,235,.34); cursor:pointer;
    transition:transform .2s ease, background .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .cart-fab:active { transform:scale(.94); background:#1d4ed8; }
  .cart-fab svg { display:block; width:27px; height:27px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

<script>
const categories=[
 {name:'Nigiri Sushi',icon:'🍣'},{name:'Maki Sushi',icon:'🍙'},{name:'Uramaki Sushi',icon:'🍘'},{name:'Gunkan Maki',icon:'🍱'},{name:'Temaki Sushi',icon:'🥗'},{name:'Oshi Sushi',icon:'🍣'},{name:'Chirashi Sushi',icon:'🍛'}
];
let products=[];
let activeCategory='Nigiri Sushi',cart=new Map(),cartSources=new Map(),discount=0,currentMobileMenu='kasir';
const PRODUCT_FOLDER_DB='rekapinyu-product-folder-handles';
let targetDirectoryHandle=null,productDirectoryHandle=null,reportDirectoryHandle=null,productFolderReady=false,lastJsonSignature='',folderReadBusy=false;
const money=n=>'Rp. '+Math.round(Number(n||0)*1000).toLocaleString('id-ID'); // UI values are in thousands of rupiah.
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function numberValue(value){
 if(typeof value==='number')return Number.isFinite(value)?value:0;
 if(value==null||value==='')return 0;
 const str=String(value).trim().replace(/\s/g,'');
 if(/[.,]\d{3}$/.test(str)&&/[.,]/.test(str))return Number(str.replace(/[^\d-]/g,''))||0;
 const decimal=Number(str.replace(/,/g,'.'));
 if(Number.isFinite(decimal))return decimal;
 return Number(str.replace(/[^\d-]/g,''))||0;
}
function firstValue(obj,keys){for(const key of keys){if(obj&&obj[key]!==undefined&&obj[key]!==null&&obj[key]!=='')return obj[key]}return undefined;}
function toUiAmount(obj,keys,internalKeys){
 const internal=firstValue(obj,internalKeys||[]);
 if(internal!==undefined)return numberValue(internal);
 for(const key of keys){
  if(obj&&obj[key]!==undefined&&obj[key]!==null&&obj[key]!==''){
   const n=numberValue(obj[key]);
   // Indonesian aliases are stored as actual Rupiah; legacy `price`/`cost` can be UI-thousands.
   return ['hargaJual','harga_jual','harga jual','hargaBeli','harga_beli','hpp','hargaPokok','harga_pokok'].includes(key)?n/1000:(n>1000?n/1000:n);
  }
 }
 return 0;
}
function normalizeProduct(raw,index=0){
 const source=(raw&&typeof raw==='object'&&!Array.isArray(raw))?raw:{};
 let rawId=firstValue(source,['id','idProduk','id_produk','productId','kodeProduk','kode_produk','sku']);
 if(rawId===undefined)rawId=index+1;
 const numericId=Number(rawId);
 const id=String(rawId).trim()!==''&&Number.isFinite(numericId)?numericId:String(rawId);
 const name=String(firstValue(source,['name','namaProduk','nama_produk','Nama Produk','nama produk','nama','productName'])??'').trim();
 const category=String(firstValue(source,['category','kategori','Kategori','jenisProduk','jenis_produk'])??'Lainnya').trim();
 const barcodeValue=firstValue(source,['barcode','Barcode','barCode','kodeBarcode','kode_barcode','kode_batang']);
 const barcode=Array.isArray(barcodeValue)?String(barcodeValue[0]??''):String(barcodeValue??'');
 const price=toUiAmount(source,['price','hargaJual','harga_jual','harga jual','Harga Jual'],['priceInternal','hargaJualInternal']);
 const cost=toUiAmount(source,['cost','hpp','HPP','hargaBeli','harga_beli','Harga Beli','Harga HPP','hargaPokok','harga_pokok'],['costInternal','hppInternal']);
 const stockManual=Math.max(0,numberValue(firstValue(source,['stockManual','stokManual','stok_manual','stock_manual','Stok Manual','stok manual','stok','stock'])??0));
 const stockBarcode=Math.max(0,numberValue(firstValue(source,['stockBarcode','stokBarcode','stok_barcode','stock_barcode','Stok Barcode','stok barcode','barcodeStock'])??0));
 const photo=String(firstValue(source,['photo','foto','Foto','Foto Produk','fotoProduk','foto_produk','imageUrl','image','gambar','urlFoto'])??'');
 return {...source,id,name,category,desc:String(firstValue(source,['desc','deskripsi','satuan','unit'])??'1 pcs'),price,cost,barcode,stockManual,stockBarcode,photo,icon:String(firstValue(source,['icon','emoji'])??'📦')};
}
function productIdentity(p){
 const barcode=String(p.barcode||'').trim().toLowerCase();
 if(barcode)return 'barcode:'+barcode;
 const name=String(p.name||'').trim().toLowerCase(),category=String(p.category||'').trim().toLowerCase();
 if(name)return 'name:'+name+'|'+category;
 return 'id:'+String(p.id);
}
function extractProducts(parsed){
 if(Array.isArray(parsed))return parsed;
 if(!parsed||typeof parsed!=='object')return [];
 for(const key of ['products','produk','Produk','daftarProduk','daftar_produk','dataProduk','data_produk','items','data','list'])if(Array.isArray(parsed[key]))return parsed[key];
 if(firstValue(parsed,['name','nama','namaProduk','nama_produk','productName']))return [parsed];
 return [];
}
function openProductFolderDb(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB tidak tersedia'));return;}
  const request=indexedDB.open(PRODUCT_FOLDER_DB,1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('handles'))request.result.createObjectStore('handles');};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('Gagal membuka penyimpanan folder'));
 });
}
async function storeTargetHandle(handle){
 const db=await openProductFolderDb();
 await new Promise((resolve,reject)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,'product-target');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Gagal menyimpan folder target'));});
 db.close();
}
async function getStoredTargetHandle(){
 const db=await openProductFolderDb();
 const value=await new Promise((resolve,reject)=>{const tx=db.transaction('handles','readonly');const req=tx.objectStore('handles').get('product-target');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('Gagal membaca folder target'));});
 db.close();return value;
}
async function directoryPermission(handle,request=false){
 if(!handle)return 'denied';
 try{const opts={mode:'readwrite'};let state=await handle.queryPermission(opts);if(state!=='granted'&&request&&typeof handle.requestPermission==='function')state=await handle.requestPermission(opts);return state;}catch(_){return 'denied';}
}
async function ensureProductSubfolder(create=false){
 if(!targetDirectoryHandle)return null;
 try{return await targetDirectoryHandle.getDirectoryHandle('Produk Kasir',{create});}catch(_){return null;}
}
async function ensureReportSubfolder(create=false){
 if(!targetDirectoryHandle)return null;
 try{return await targetDirectoryHandle.getDirectoryHandle('Laporan Kasir',{create});}catch(_){return null;}
}
async function migrateLegacyProductFiles(destination){
 // Keep older installations working: if Produk Kasir has no canonical product JSON,
 // copy legacy JSON/photo files from the former Produk folder without deleting originals.
 if(!targetDirectoryHandle||!destination)return 0;
 try{
  let hasCanonicalJson=false;
  for await(const [name,handle] of destination.entries()){
   if(handle.kind==='file'&&['produk.json','produkkasir.json','products.json','produk-kasir.json'].includes(name.toLowerCase())){hasCanonicalJson=true;break;}
  }
  if(hasCanonicalJson)return 0;
  const legacy=await targetDirectoryHandle.getDirectoryHandle('Produk',{create:false});
  const legacyFiles=[];
  for await(const [name,handle] of legacy.entries()){
   if(handle.kind==='file'&&(/\.json$/i.test(name)||PRODUCT_IMAGE_EXTENSIONS.test(name)))legacyFiles.push({name,handle});
  }
  let copied=0;
  for(const item of legacyFiles){
   let existing=null;
   try{existing=await destination.getFileHandle(item.name,{create:false});}catch(_){}
   if(existing)continue;
   try{
    const sourceFile=await item.handle.getFile();
    const destHandle=await destination.getFileHandle(item.name,{create:true});
    const writable=await destHandle.createWritable();
    try{await writable.write(await sourceFile.arrayBuffer());await writable.close();copied++;}
    catch(error){try{await writable.abort();}catch(_){}throw error;}
   }catch(error){/* Leave any source file untouched if migration of that file fails. */}
  }
  return copied;
 }catch(_){return 0;}
}
function updateProductFolderButton(handle=targetDirectoryHandle){
 const button=document.getElementById('createProductFolderBtn');
 if(!button)return;
 const name=handle&&handle.name?String(handle.name):'';
 button.replaceChildren();
 if(name){
  const icon=document.createElement('span');
  icon.className='material-symbols-rounded pm-folder-icon';
  icon.setAttribute('aria-hidden','true');
  icon.textContent='folder';
  const label=document.createElement('span');
  label.className='pm-folder-name';
  label.textContent=name;
  button.append(icon,label);
 }else{
  button.textContent='Buat Folder';
 }
 button.title=name?`Folder terpilih: ${name}`:'Pilih Folder Target';
 button.setAttribute('aria-label',name?`Folder target terpilih: ${name}`:'Buat Folder');
 button.classList.toggle('has-selected-folder',!!name);
}
function selectedProductsPath(){return targetDirectoryHandle?`${targetDirectoryHandle.name}/Produk Kasir`:'Folder Target/Produk Kasir';}
async function getJsonFileHandles(){
 const files=[];
 if(!productDirectoryHandle)return files;
 for await(const [name,handle] of productDirectoryHandle.entries())if(handle.kind==='file'&&name.toLowerCase().endsWith('.json'))files.push({name,handle});
 files.sort((a,b)=>{
  const canonical=name=>['produk.json','produkkasir.json','products.json','produk-kasir.json'].includes(name.toLowerCase());
  return Number(canonical(a.name))-Number(canonical(b.name))||a.name.localeCompare(b.name);
 });
 return files;
}
const PRODUCT_IMAGE_EXTENSIONS=/\.(jpe?g|png|webp|gif|bmp|avif|svg)$/i;
async function getProductImageFileHandles(){
 const images=[];
 const collect=async(directory,path)=>{
  if(!directory)return;
  try{
   for await(const [name,handle] of directory.entries()){
    if(handle.kind==='file'&&PRODUCT_IMAGE_EXTENSIONS.test(name))images.push({name,path,handle});
   }
  }catch(_){/* Folder may be readable only partially; JSON products remain usable. */}
 };
 // Search both the selected target folder and its Produk Kasir subfolder.
 await collect(targetDirectoryHandle,'target');
 if(productDirectoryHandle&&productDirectoryHandle!==targetDirectoryHandle)await collect(productDirectoryHandle,'Produk Kasir');
 // Prefer an image inside Produk Kasir when duplicate filenames exist.
 images.sort((a,b)=>Number(a.path==='Produk Kasir')-Number(b.path==='Produk Kasir')||a.name.localeCompare(b.name));
 return images;
}
function normalizedPhotoKey(value){
 let name=String(value??'').trim().split(/[?#]/)[0].replace(/\\/g,'/').split('/').pop()||'';
 name=name.replace(/\.(jpe?g|png|webp|gif|bmp|avif|svg)$/i,'');
 try{name=decodeURIComponent(name);}catch(_){}
 return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
}
function readImageAsDataUrl(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(typeof reader.result==='string'?reader.result:'');
  reader.onerror=()=>reject(reader.error||new Error('Foto tidak bisa dibaca'));
  reader.readAsDataURL(file);
 });
}
async function currentJsonSignature(files=null,imageFiles=null){
 const list=files||await getJsonFileHandles(),images=imageFiles||await getProductImageFileHandles(),parts=[];
 for(const item of list){try{const file=await item.handle.getFile();parts.push(`json:${item.name}:${file.size}:${file.lastModified}`);}catch(_){parts.push(`json:${item.name}:unreadable`);}}
 for(const item of images){try{const file=await item.handle.getFile();parts.push(`img:${item.path}/${item.name}:${file.size}:${file.lastModified}`);}catch(_){parts.push(`img:${item.path}/${item.name}:unreadable`);}}
 return parts.join('|');
}
async function attachFolderPhotos(productList,imageFiles){
 const byName=new Map(),loaded=[];
 for(const item of imageFiles){
  try{
   const file=await item.handle.getFile();
   const dataUrl=await readImageAsDataUrl(file);
   if(!dataUrl)continue;
   const key=normalizedPhotoKey(item.name);
   const image={name:item.name,key,dataUrl,path:item.path};
   loaded.push(image);
   if(key)byName.set(key,image);
  }catch(_){/* Ignore unreadable image files; continue with other images. */}
 }
 const sharedPhoto=byName.get('fotoproduk')||byName.get('fotoprodukdefault')||byName.get('produkfoto')||null;
 for(const product of productList){
  product.folderPhoto='';
  const saved=String(product.photo||'').trim();
  // Photos embedded in JSON or explicitly hosted keep priority.
  if(/^(data:image\/|https?:\/\/|blob:|file:)/i.test(saved))continue;
  const candidates=[];
  if(saved)candidates.push(saved);
  if(product.barcode)candidates.push(product.barcode);
  if(product.id!==undefined&&product.id!==null)candidates.push(String(product.id));
  if(product.name)candidates.push(product.name);
  if(product.name){
   candidates.push(`foto produk ${product.name}`,`foto ${product.name}`,`${product.name} foto`,`produk ${product.name}`);
  }
  let match=null;
  for(const candidate of candidates){
   match=byName.get(normalizedPhotoKey(candidate));
   if(match)break;
  }
  // A shared file named "foto produk.jpg" is supported as a fallback when no product-specific image exists.
  if(!match)match=sharedPhoto;
  if(match)product.folderPhoto=match.dataUrl;
 }
}
async function refreshProductsFromFolder(force=false,showError=false){
 if(folderReadBusy)return false;
 if(!productFolderReady||!productDirectoryHandle){
  if(products.length){products=[];renderProducts();renderCart();}
  return false;
 }
 folderReadBusy=true;
 try{
  const files=await getJsonFileHandles();
  const imageFiles=await getProductImageFileHandles();
  const signature=await currentJsonSignature(files,imageFiles);
  if(!force&&signature===lastJsonSignature)return false;
  const merged=new Map();let sequence=0;
  for(const item of files){
   try{
    const file=await item.handle.getFile();
    const parsed=JSON.parse(await file.text());
    for(const raw of extractProducts(parsed)){
     const product=normalizeProduct(raw,++sequence);
     if(!product.name)continue;
     merged.set(productIdentity(product),product);
    }
   }catch(error){if(showError)console.warn('JSON produk dilewati:',item.name,error);}
  }
  const next=[...merged.values()];
  const used=new Set();let nextId=1;
  for(const p of next){
   if(!Number.isFinite(Number(p.id))||used.has(String(p.id))){while(used.has(String(nextId)))nextId++;p.id=nextId++;}
   used.add(String(p.id));
   p.stockManual=Math.max(0,numberValue(p.stockManual));p.stockBarcode=Math.max(0,numberValue(p.stockBarcode));
  }
  await attachFolderPhotos(next,imageFiles);
  products=next;
  lastJsonSignature=signature;
  renderProducts();renderCart();
  return true;
 }catch(error){
  if(showError)toast('Gagal membaca JSON/foto dari subfolder Produk Kasir');
  return false;
 }finally{folderReadBusy=false;}
}
function canonicalProductData(p){
 const costActual=Math.round(Number(p.cost??p.price*.8)*1000),priceActual=Math.round(Number(p.price||0)*1000);
 const stockManual=Math.max(0,Math.floor(Number(p.stockManual)||0)),stockBarcode=Math.max(0,Math.floor(Number(p.stockBarcode)||0));
 return {id:p.id,name:p.name,namaProduk:p.name,category:p.category,kategori:p.category,desc:p.desc||'1 pcs',price:priceActual,priceInternal:Number(p.price)||0,hargaJual:priceActual,cost:costActual,costInternal:Number(p.cost??p.price*.8),hpp:costActual,barcode:p.barcode||'',stockManual,stokManual:stockManual,stockBarcode,stokBarcode:stockBarcode,photo:p.photo||'',icon:p.icon||'📦'};
}
async function writeProductsToJson(){
 if(!productFolderReady||!productDirectoryHandle)throw new Error('Folder target/Produk Kasir belum dipilih');
 const fileHandle=await productDirectoryHandle.getFileHandle('Produk.json',{create:true});
 const writable=await fileHandle.createWritable();
 try{await writable.write(JSON.stringify({schemaVersion:1,updatedAt:new Date().toISOString(),products:products.map(canonicalProductData)},null,2));await writable.close();}
 catch(error){try{await writable.abort();}catch(_){}throw error;}
 lastJsonSignature='';
 await refreshProductsFromFolder(true,false);
}
async function setupProductFolder(handle,create=true){
 const previousHandle=targetDirectoryHandle;
 let sameTarget=false;
 if(previousHandle&&handle&&typeof handle.isSameEntry==='function'){
  try{sameTarget=await handle.isSameEntry(previousHandle);}catch(_){sameTarget=false;}
 }
 targetDirectoryHandle=handle;
 updateProductFolderButton(handle);
 productFolderReady=false;productDirectoryHandle=null;reportDirectoryHandle=null;lastJsonSignature='';
 if(!sameTarget){
  products=[];cart.clear();cartSources.clear();discount=0;cartDrawerSnapshot=null;
  const promo=document.getElementById('promo');if(promo)promo.value='';
 }
 await storeTargetHandle(handle);
 // Automatically create both required child folders inside the selected directory.
 const productSubfolder=await ensureProductSubfolder(true);
 const reportSubfolder=await ensureReportSubfolder(true);
 if(!productSubfolder)throw new Error('Subfolder Produk Kasir tidak dapat dibuat');
 if(!reportSubfolder)throw new Error('Subfolder Laporan Kasir tidak dapat dibuat');
 productDirectoryHandle=productSubfolder;
 reportDirectoryHandle=reportSubfolder;
 await migrateLegacyProductFiles(productDirectoryHandle);
 productFolderReady=true;lastJsonSignature='';
 await refreshProductsFromFolder(true,true);
}
async function restoreProductFolderOnStartup(){
 products=[];productFolderReady=false;productDirectoryHandle=null;reportDirectoryHandle=null;targetDirectoryHandle=null;
 try{
  const handle=await getStoredTargetHandle();
  if(!handle){updateProductFolderButton(null);renderProducts();renderCart();return;}
  targetDirectoryHandle=handle;
  updateProductFolderButton(handle);
  if(await directoryPermission(handle,false)!=='granted'){renderProducts();renderCart();return;}

// Printer Bluetooth pairing and best-effort reconnect for previously permitted BLE printers.
// Web Bluetooth requires HTTPS and does not support every classic Bluetooth/SPP printer.
const mobileBluetoothButton = document.getElementById('mobileBluetooth');
const bluetoothStatusIcon = document.getElementById('bluetoothStatusIcon');
const BLUETOOTH_PRINTER_STORAGE_KEY = 'rekapinyu.bluetoothPrinter.v1';
let selectedBluetoothPrinter = null;
let bluetoothDisconnectHandler = null;
let bluetoothReconnectTimer = null;
let bluetoothReconnectAttempts = 0;
let bluetoothReconnectInProgress = false;
const BLUETOOTH_RECONNECT_DELAYS = [1500, 2500, 4000, 7000, 12000, 20000, 30000];
function setBluetoothButtonState(state, title, iconName) {
  if (!mobileBluetoothButton) return;
  mobileBluetoothButton.classList.remove('is-scanning','is-connected','is-error');
  if (state) mobileBluetoothButton.classList.add('is-' + state);
  mobileBluetoothButton.title = title;
  mobileBluetoothButton.setAttribute('aria-label', title);
  if (bluetoothStatusIcon && iconName) bluetoothStatusIcon.textContent = iconName;
}
function getSavedBluetoothPrinter() {
  try {
    const raw = localStorage.getItem(BLUETOOTH_PRINTER_STORAGE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    return saved && typeof saved.id === 'string' && saved.id ? saved : null;
  } catch (_) { return null; }
}
function saveBluetoothPrinterPreference(device) {
  if (!device || !device.id) return;
  try {
    localStorage.setItem(BLUETOOTH_PRINTER_STORAGE_KEY, JSON.stringify({ id:device.id, name:device.name || '', savedAt:Date.now() }));
  } catch (error) { console.warn('Preferensi printer Bluetooth tidak dapat disimpan:', error); }
}
function clearBluetoothReconnectTimer() {
  if (bluetoothReconnectTimer !== null) clearTimeout(bluetoothReconnectTimer);
  bluetoothReconnectTimer = null;
}
function bindBluetoothPrinterDisconnect(device) {
  if (bluetoothDisconnectHandler && selectedBluetoothPrinter) {
    selectedBluetoothPrinter.removeEventListener('gattserverdisconnected', bluetoothDisconnectHandler);
  }
  selectedBluetoothPrinter = device;
  bluetoothDisconnectHandler = () => {
    if (selectedBluetoothPrinter !== device) return;
    setBluetoothButtonState('', 'Printer terputus — mencoba menyambungkan kembali…','bluetooth_disabled');
    scheduleBluetoothAutoReconnect();
  };
  device.addEventListener('gattserverdisconnected', bluetoothDisconnectHandler);
}
function scheduleBluetoothAutoReconnect(delay) {
  if (bluetoothReconnectTimer !== null) return;
  if (bluetoothReconnectAttempts >= BLUETOOTH_RECONNECT_DELAYS.length) {
    setBluetoothButtonState('error', 'Printer belum tersambung — klik Bluetooth untuk mencoba lagi', 'bluetooth_disabled');
    return;
  }
  const wait = Number.isFinite(delay) ? delay : BLUETOOTH_RECONNECT_DELAYS[bluetoothReconnectAttempts];
  bluetoothReconnectAttempts++;
  bluetoothReconnectTimer = setTimeout(() => {
    bluetoothReconnectTimer = null;
    reconnectSavedBluetoothPrinter({ silent:true });
  }, wait);
}
function bluetoothErrorMessage(error) {
  if (!error) return 'Koneksi Bluetooth gagal.';
  if (error.name === 'NotFoundError' || error.name === 'AbortError' || error.name === 'NotAllowedError') return 'Pemilihan printer dibatalkan.';
  if (error.name === 'SecurityError') return 'Akses Bluetooth diblokir. Buka aplikasi melalui HTTPS dan izinkan Bluetooth.';
  if (error.name === 'NetworkError') return 'Printer tidak dapat dihubungkan. Pastikan printer menyala dan belum terhubung ke perangkat lain.';
  return 'Gagal menghubungkan printer Bluetooth: ' + (error.message || error.name || 'kesalahan tidak diketahui');
}
async function reconnectSavedBluetoothPrinter(options = {}) {
  const silent = options.silent !== false;
  if (bluetoothReconnectInProgress || !navigator.bluetooth || !window.isSecureContext) return false;
  if (selectedBluetoothPrinter && selectedBluetoothPrinter.gatt && selectedBluetoothPrinter.gatt.connected) {
    setBluetoothButtonState('connected', 'Terhubung: ' + (selectedBluetoothPrinter.name || 'Printer Bluetooth') + ' — klik untuk memilih perangkat lain', 'bluetooth_connected');
    return true;
  }
  const saved = getSavedBluetoothPrinter();
  if (!saved || typeof navigator.bluetooth.getDevices !== 'function') return false;
  bluetoothReconnectInProgress = true;
  try {
    const permittedDevices = await navigator.bluetooth.getDevices();
    const device = permittedDevices.find(item => item && item.id === saved.id);
    if (!device) {
      setBluetoothButtonState('', 'Printer tersimpan belum tersedia bagi situs ini — klik untuk pairing ulang', 'bluetooth_searching');
      return false;
    }
    setBluetoothButtonState('scanning', 'Menyambungkan ulang ' + (device.name || saved.name || 'printer Bluetooth') + '…', 'bluetooth_searching');
    if (!device.gatt) throw new Error('Perangkat tidak menyediakan koneksi BLE GATT. Printer Bluetooth klasik mungkin memerlukan aplikasi Android atau penghubung native.');
    if (selectedBluetoothPrinter !== device || !bluetoothDisconnectHandler) bindBluetoothPrinterDisconnect(device);
    if (!device.gatt.connected) await device.gatt.connect();
    clearBluetoothReconnectTimer();
    bluetoothReconnectAttempts = 0;
    setBluetoothButtonState('connected', 'Terhubung: ' + (device.name || saved.name || 'Printer Bluetooth') + ' — klik untuk memilih perangkat lain', 'bluetooth_connected');
    if (!silent) toast('Printer Bluetooth tersambung kembali: ' + (device.name || saved.name || 'Printer'));
    return true;
  } catch (error) {
    console.warn('Penyambungan ulang printer Bluetooth belum berhasil:', error);
    setBluetoothButtonState('error', 'Belum tersambung — mencoba ulang otomatis atau klik untuk pairing', 'bluetooth_disabled');
    scheduleBluetoothAutoReconnect();
    return false;
  } finally {
    bluetoothReconnectInProgress = false;
  }
}
async function scanAndPairBluetoothPrinter() {
  if (!mobileBluetoothButton || mobileBluetoothButton.disabled) return;
  if (!window.isSecureContext || !navigator.bluetooth || typeof navigator.bluetooth.requestDevice !== 'function') {
    setBluetoothButtonState('error','Bluetooth tidak didukung di browser ini','bluetooth_disabled');
    toast('Bluetooth Web memerlukan HTTPS dan browser yang mendukung Web Bluetooth (misalnya Chrome/Edge).');
    return;
  }
  const previousPrinter = selectedBluetoothPrinter;
  clearBluetoothReconnectTimer();
  mobileBluetoothButton.disabled = true;
  setBluetoothButtonState('scanning','Mencari printer Bluetooth…','bluetooth_searching');
  toast('Pilih printer Bluetooth dari daftar perangkat.');
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        'battery_service',
        'device_information',
        '000018f0-0000-1000-8000-00805f9b34fb',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb'
      ]
    });
    bindBluetoothPrinterDisconnect(device);
    saveBluetoothPrinterPreference(device);
    if (!device.gatt) throw new Error('Perangkat tidak menyediakan koneksi BLE GATT. Printer Bluetooth klasik mungkin memerlukan aplikasi Android atau penghubung native.');
    if (!device.gatt.connected) await device.gatt.connect();
    clearBluetoothReconnectTimer();
    bluetoothReconnectAttempts = 0;
    setBluetoothButtonState('connected', 'Terhubung: ' + (device.name || 'Printer Bluetooth') + ' — klik untuk memilih perangkat lain','bluetooth_connected');
    toast('Printer Bluetooth terhubung: ' + (device.name || 'Printer'));
  } catch (error) {
    console.warn('Pairing printer Bluetooth gagal/dibatalkan:', error);
    if (previousPrinter && previousPrinter.gatt && previousPrinter.gatt.connected) {
      bindBluetoothPrinterDisconnect(previousPrinter);
      setBluetoothButtonState('connected','Terhubung: ' + (previousPrinter.name || 'Printer Bluetooth'),'bluetooth_connected');
    } else {
      selectedBluetoothPrinter = null;
      const cancelled = error && ['NotFoundError','AbortError','NotAllowedError'].includes(error.name);
      setBluetoothButtonState(cancelled ? '' : 'error', cancelled ? 'Cari printer Bluetooth' : 'Koneksi Bluetooth gagal — mencoba ulang otomatis atau klik untuk pairing', cancelled ? 'bluetooth_searching' : 'bluetooth_disabled');
      if (!cancelled) toast(bluetoothErrorMessage(error));
      if (!cancelled && getSavedBluetoothPrinter()) scheduleBluetoothAutoReconnect(1800);
    }
  } finally {
    mobileBluetoothButton.disabled = false;
  }
}
if (mobileBluetoothButton) mobileBluetoothButton.addEventListener('click', scanAndPairBluetoothPrinter);

 const stockManualRaw=document.getElementById('editProductStockManual').value;
 const stockBarcodeRaw=document.getElementById('editProductStockBarcode').value;
 const hpp=Number(hppRaw),price=Number(priceRaw),stockManual=Number(stockManualRaw),stockBarcode=Number(stockBarcodeRaw);
 if(!name){toast('Nama produk wajib diisi');document.getElementById('editProductName').focus();return;}
 if(!category){toast('Kategori produk wajib dipilih');document.getElementById('editProductCategory').focus();return;}
 if(hppRaw===''||!Number.isFinite(hpp)||hpp<0){toast('HPP tidak valid');document.getElementById('editProductHpp').focus();return;}
 if(priceRaw===''||!Number.isFinite(price)||price<=0){toast('Harga jual tidak valid');document.getElementById('editProductPrice').focus();return;}
 if(!Number.isInteger(stockManual)||stockManual<0||!Number.isInteger(stockBarcode)||stockBarcode<0){toast('Stok harus berupa bilangan bulat nol atau lebih');return;}
 if(products.some(p=>String(p.id)!==String(editingProductId)&&p.name.toLowerCase()===name.toLowerCase()&&p.category===category)){toast('Produk dengan nama dan kategori tersebut sudah ada');return;}
 const before={...product};
 Object.assign(product,{name,category,barcode,cost:hpp/1000,price:price/1000,stockManual,stockBarcode,photo:editedPhotoDataUrl!==null?editedPhotoDataUrl:(product.photo||'')});
 try{await writeProductsToJson();}
 catch(error){Object.assign(product,before);renderProducts();renderCart();toast('Edit gagal disimpan ke Produk Kasir/Produk.json. Periksa izin folder target.');return;}
 closeProductEdit();renderProducts();renderCart();toast(`Perubahan produk berhasil disimpan ke ${selectedProductsPath()}/Produk.json`);
});
async function deleteManagedProduct(id){
 const product=findProductById(id);if(!product){toast('Produk tidak ditemukan');return;}
 if(!productFolderReady||!productDirectoryHandle){toast('Pilih folder target terlebih dahulu');return;}
 if(!window.confirm(`Hapus produk "${product.name}" dari ${selectedProductsPath()}?`))return;
 const beforeProducts=products.map(p=>({...p}));
 const beforeCart=new Map(cart),beforeSources=new Map([...cartSources].map(([key,value])=>[key,{...value}]));
 products=products.filter(p=>String(p.id)!==String(id));
 try{await writeProductsToJson();}
 catch(error){products=beforeProducts;cart=beforeCart;cartSources=beforeSources;renderProducts();renderCart();toast('Hapus gagal disimpan ke Produk Kasir/Produk.json. Periksa izin folder target.');return;}
 for(const key of [...cart.keys()])if(String(key)===String(id)){cart.delete(key);cartSources.delete(key);}
 renderProducts();renderCart();toast(`Produk berhasil dihapus dari ${selectedProductsPath()}/Produk.json`);
}

async function chooseProductTargetFolder(){
 if(typeof window.showDirectoryPicker!=='function'){toast('Browser ini tidak mendukung pemilihan folder. Gunakan Chrome atau Edge terbaru.');return;}
 try{
  // Always open the picker, so a different target folder can be selected later.

async function completeSale({requirePayment=false,closeDrawer=false}={}){
 if(!cart.size){toast('Keranjang masih kosong');return false;}
 if(requirePayment&&!document.getElementById('payment').value){toast('Pilih metode pembayaran terlebih dahulu');return false;}
 if(!productFolderReady||!productDirectoryHandle){toast('Transaksi tidak disimpan: pilih folder target di menu Produk terlebih dahulu');return false;}
 const priorProducts=products.map(p=>({...p}));
 for(const [id,qty] of cart.entries()){
  const p=findProductById(id);if(!p)continue;
  const split=cartSources.get(id)||{manual:qty,barcode:0};
  let manualQty=Math.max(0,Math.min(qty,Number(split.manual)||0));
  let barcodeQty=Math.max(0,Math.min(qty-manualQty,Number(split.barcode)||0));
  const unassigned=Math.max(0,qty-manualQty-barcodeQty);
  manualQty+=unassigned;
  let manualStock=Math.max(0,Number(p.stockManual)||0),barcodeStock=Math.max(0,Number(p.stockBarcode)||0);
  const fromManual=Math.min(manualStock,manualQty);manualStock-=fromManual;
  const manualOverflow=manualQty-fromManual;const fromBarcodeForManual=Math.min(barcodeStock,manualOverflow);barcodeStock-=fromBarcodeForManual;
  const fromBarcode=Math.min(barcodeStock,barcodeQty);barcodeStock-=fromBarcode;
  const barcodeOverflow=barcodeQty-fromBarcode;const fromManualForBarcode=Math.min(manualStock,barcodeOverflow);manualStock-=fromManualForBarcode;
  p.stockManual=manualStock;p.stockBarcode=barcodeStock;
 }
 try{await writeProductsToJson();}
 catch(error){products=priorProducts;renderProducts();renderCart();toast('Transaksi belum diselesaikan: gagal memperbarui JSON stok. Periksa izin folder.');return false;}
 cart.clear();cartSources.clear();discount=0;
 const promo=document.getElementById('promo');if(promo)promo.value='';
 renderProducts();renderCart();
 if(closeDrawer){cartDrawerSnapshot=null;closeCartDrawer();}
 toast(`Transaksi berhasil. Stok di ${selectedProductsPath()} telah diperbarui.`);
 return true;
}

let cartDrawerSnapshot=null;

function openCartDrawer(){

function closeCartDrawer(){
 document.getElementById('cartDrawer').classList.remove('is-open');

 document.getElementById('cartDrawerBackdrop').setAttribute('aria-hidden','true');
 document.getElementById('cartFab').setAttribute('aria-expanded','false');
 document.body.classList.remove('cart-drawer-body-open');
}
async function saveCartDrawer(){
 // On the mobile cashier drawer, Simpan finalizes the current sale and writes the reduced stock to JSON.
 const done=await completeSale({requirePayment:false,closeDrawer:true});
 if(done)cartDrawerSnapshot=null;
}
function cancelCartDrawer(){
 if(cartDrawerSnapshot){
  cart=new Map(cartDrawerSnapshot.cart);
  cartSources=new Map([...(cartDrawerSnapshot.cartSources||new Map())].map(([id,value])=>[id,{...value}]));
  discount=cartDrawerSnapshot.discount;
  document.getElementById('promo').value=cartDrawerSnapshot.promo;
  document.getElementById('payment').value=cartDrawerSnapshot.payment;
  renderCart();
 }
 cartDrawerSnapshot=null;
 closeCartDrawer();
 toast('Perubahan keranjang dibatalkan');
}

// Firebase logout: sign out from Firebase first, then clear compatible app auth markers.
async function logoutAndRedirectToLogin(){
  const button = document.querySelector('.mobile-logout');
  if (button) { button.disabled = true; button.setAttribute('aria-busy', 'true'); }
  try {
    // Wait for Firebase modular SDK initialization (defined in the module script below).
    if (window.rekapinyuFirebaseReady) await window.rekapinyuFirebaseReady;
    if (typeof window.rekapinyuFirebaseSignOut !== 'function') {
      throw new Error('Firebase Authentication belum berhasil diinisialisasi. Periksa koneksi internet dan domain Firebase.');
    }
    await window.rekapinyuFirebaseSignOut();

    const authKeyPattern = /(^|[._:-])(auth|authtoken|token|session|login|loggedin|logged_in|currentuser|current_user|userdata|user_data|userid|user_id|access_token|refreshtoken|refresh_token|id_token|idtoken)([._:-]|$)/i;
    const commonAuthKeys = new Set([
      'auth','authtoken','accessToken','access_token','refreshToken','refresh_token','idToken','id_token',
      'token','session','user','userData','user_data','currentUser','current_user','userId','user_id',
      'isLoggedIn','loggedIn','rekapinyuUser','rekapinyu_user','rekapinyuToken','rekapinyu_token',
      'rekapinyuAuth','rekapinyu_auth','authUser','auth_user','supabase.auth.token'
    ]);
    for (const storage of [window.localStorage, window.sessionStorage]) {
      const removeKeys = [];
      for (let i = 0; i < storage.length; i++) {
        const key = storage.key(i);
        if (!key) continue;
        const normalized = key.toLowerCase();
        if (commonAuthKeys.has(key) || commonAuthKeys.has(normalized) || authKeyPattern.test(key) || /^(firebase:authuser:|sb-.+-auth-token$)/i.test(key)) {
          // Preserve product-folder handles and business data.
          if (!/(product.?folder|folder.?handle|cart|product.?data|produk.?kasir)/i.test(key)) removeKeys.push(key);
        }
      }
      removeKeys.forEach(key => storage.removeItem(key));
    }
  } catch (error) {
    console.error('Logout Firebase gagal:', error);
    if (button) { button.disabled = false; button.removeAttribute('aria-busy'); }
    if (typeof toast === 'function') toast('Logout Firebase gagal. Periksa koneksi lalu coba lagi.');
    return; // Do not pretend Firebase logout succeeded or redirect while the account may remain signed in.
  }
  window.location.replace('https://rekapinyu.web.id/login');
}
const mobileLogoutButton = document.querySelector('.mobile-logout');
if (mobileLogoutButton) {
  mobileLogoutButton.addEventListener('click', logoutAndRedirectToLogin);
}
