<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sushi POS — Cashier</title>
<style>
:root{--green:#0aa883;--green-dark:#078b6d;--mint:#e5f5f1;--ink:#17191b;--muted:#858b8a;--line:#eceeed;--bg:#f3f5f4}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:12px}
button,input,select{font:inherit}button{cursor:pointer}
.stage{min-height:100vh;display:block;padding:0}
.browser{width:100%;height:100vh;min-height:650px;background:#fff;border-radius:0;overflow:hidden;box-shadow:none;display:flex;flex-direction:column}
.browserbar{display:none}
.dot{height:8px;width:8px;border-radius:50%;display:inline-block}.red{background:#fa6a63}.yellow{background:#f5c24e}.green{background:#51c65d}.browsericon{margin-left:12px;font-size:14px}.address{margin:auto;background:#0c0d0f;border-radius:6px;width:42%;padding:5px;text-align:center;font-size:10px;color:#c5c8c8}
.app{display:grid;grid-template-columns:66px minmax(0,1fr) 310px;min-height:0;flex:1}
.sidebar{border-right:1px solid #f1f2f2;display:flex;flex-direction:column;align-items:center;padding:13px 0 12px;gap:11px;background:#fff}
.logo{width:39px;height:39px;background:var(--green);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.navbtn{width:39px;height:39px;border:1px solid #f1f2f2;border-radius:11px;background:#fff;color:#a9afad;display:grid;place-items:center;font-size:19px;box-shadow:0 1px 2px #00000005}
.navbtn.active{background:#e6f6f2;border-color:#e6f6f2;color:var(--green)}.navspacer{flex:1}
.avatar{width:39px;height:39px;border-radius:11px;background:#e4f5f0;display:grid;place-items:center;font-size:22px}
.main{padding:18px 18px 16px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.mainhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.mainhead h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.4px}
.searchrow{display:flex;gap:8px}.search{width:220px;max-width:26vw;border:1px solid #eff0f0;border-radius:7px;padding:8px 10px;outline:none}.filter{border:1px solid #eff0f0;background:#fff;border-radius:7px;padding:8px 12px;color:#5f6665}
.categories{display:grid;grid-template-columns:repeat(7,minmax(68px,1fr));gap:9px;margin-bottom:14px}
.category{border:1px solid #f0f1f1;border-radius:13px;background:#fff;min-width:0;padding:9px 4px 10px;text-align:center;color:#666d6b;display:flex;align-items:center;flex-direction:column;gap:7px;min-height:91px}
.category .food{font-size:28px;line-height:34px;filter:drop-shadow(0 3px 2px #00000012)}.category span:last-child{font-size:10px;white-space:nowrap}
.category.active{background:#e5f4f0;border-color:#e5f4f0;color:#171b19}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;overflow:auto;padding:0 0 2px;align-content:start}
.product{border:1px solid #eceeee;border-radius:13px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0;box-shadow:0 2px 4px #00000003}
.productpic{height:125px;background:linear-gradient(145deg,#fff,#fbfcfb);display:grid;place-items:center;border-bottom:1px solid #f3f3f3;position:relative;overflow:hidden}
.productpic:after{content:"";position:absolute;bottom:18px;width:66%;height:14px;border-radius:50%;background:#b7b5a83b;filter:blur(7px)}
.sushi{font-size:69px;z-index:1;filter:drop-shadow(0 5px 3px #00000017);transform:rotate(-7deg)}
.productbody{padding:9px 9px 8px;display:flex;flex-direction:column;flex:1;gap:7px}.productname{font-size:11px;font-weight:650;line-height:1.35;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.productmeta{display:flex;justify-content:space-between;align-items:center;gap:4px;color:#7b8280;font-size:10px}.price{color:var(--green-dark);font-weight:650;font-size:11px;white-space:nowrap}
.add{border:0;background:#e5f5f1;color:#0b9979;border-radius:7px;padding:7px 5px;margin-top:auto}.add:hover{background:#c9eee4}
.order{border-left:1px solid #eef0ef;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.orderhead{padding:17px 15px 13px;border-bottom:1px solid #f0f1f1;display:flex;justify-content:space-between;align-items:center}.orderhead h2{font-size:16px;margin:0;font-weight:650}.more{border:1px solid #f0f1f1;border-radius:7px;background:white;color:#8a908f;width:28px;height:28px}
.orderselectors{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 13px;border-bottom:1px solid #f1f2f2}.orderselectors select{min-width:0;width:100%;border:1px solid #f0f1f1;background:white;border-radius:7px;padding:8px;color:#727977}
.itemshead{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 9px}.itemshead strong{font-size:13px}.clear{border:0;background:transparent;color:#c44949;font-size:10px}
.cartitems{padding:0 11px;overflow:auto;flex:1;min-height:80px}.cartitem{border:1px solid #eceeee;border-radius:10px;margin-bottom:10px;padding:10px 9px 8px}.carttop{display:flex;gap:9px;align-items:center}.cartpic{width:42px;height:42px;border:1px solid #f0f0f0;border-radius:7px;display:grid;place-items:center;font-size:26px;flex-shrink:0}.cartname{font-size:10px;font-weight:650;margin-bottom:4px}.cartdesc{font-size:9px;color:#8b908f;line-height:1.4}.cartbottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.cartprice{font-weight:650;color:var(--green-dark);font-size:11px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:23px;height:23px;border:1px solid #f0f1f1;border-radius:6px;background:#fff;color:#777;font-size:15px;line-height:1}.qty .plus{background:var(--green);border-color:var(--green-dark);color:#fff}.qtynum{min-width:8px;text-align:center}
.summary{padding:12px 14px 13px;border-top:1px solid #f0f1f1}.sumrow{display:flex;justify-content:space-between;color:#747b79;font-size:10px;margin:0 0 9px}.sumrow.total{color:#171b19;font-size:11px;font-weight:700;margin:13px 0 0}.promo{display:flex;gap:7px;margin-top:14px}.promo input{min-width:0;flex:1;border:1px solid #eff0f0;border-radius:7px;padding:8px 10px}.promo button{border:1px solid #eff0f0;border-radius:7px;background:#fff;color:#6e7473;padding:0 12px}.payment{width:100%;border:1px solid #eff0f0;background:#fff;border-radius:7px;padding:8px 10px;margin-top:9px;color:#737977;text-align:left}.placeorder{width:100%;border:1px solid #087c62;background:var(--green);color:#fff;border-radius:7px;padding:9px;margin-top:10px;font-weight:600;box-shadow:0 2px 3px #008d6b24}.placeorder:hover{background:var(--green-dark)}
.empty{padding:30px 8px;text-align:center;color:#9ba19f;font-size:11px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18201e;color:#fff;border-radius:9px;padding:11px 16px;box-shadow:0 8px 30px #0002;display:none;z-index:10}
/* Desktop rule retained exactly; all responsive rules below are consolidated. */
@media (min-width: 1101px) {
  .browser { width: min(1400px, 100%); height: min(880px, calc(100vh - 64px)); }
  .app { grid-template-columns: 66px minmax(0,1fr) 310px; }
  .products { grid-template-columns: repeat(4, minmax(0,1fr)); }
}

/* Shared rules retained from the original file so desktop behavior remains unchanged. */
html { min-height: 100%; scroll-behavior: smooth; }
body { min-height: 100%; }
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh;
  min-height: 0; overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior-y: contain;
  scrollbar-width: none; -ms-overflow-style: none; z-index: 5;
}
.sidebar::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
.sidebar > * { flex-shrink: 0; }
.sidebar .navspacer { flex: 0 0 12px; min-height: 12px; }
.inventory-state, .inventory-price { display: none; }

/* Default: mobile-only controls are not shown on desktop. */
.mobile-brand, .mobile-nav, .mobile-toolbar { display: none; }

/* Portrait lock for phone/tablet widths. */
@media screen and (orientation: portrait) and (max-width: 1100px) {
  body { overflow: hidden !important; }
  body::after {
    content: "Putar perangkat ke posisi horizontal (landscape) untuk menggunakan kasir";
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: #f5f7f6;
    color: #17191b;
    text-align: center;
    font: 600 17px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
}

/* One responsive layout for landscape phones and tablets. */
@media screen and (orientation: landscape) and (max-width: 1100px) {
  html, body { width: 100%; height: 100%; min-height: 0; margin: 0; overflow: hidden; }
  .stage { display: block; width: 100%; height: 100dvh; min-height: 0; padding: 0; }
  .browser { display: flex; width: 100%; height: 100dvh; min-height: 0; max-height: none; border-radius: 0; overflow: hidden; box-shadow: none; }
  .browserbar { display: none !important; }
  .app {
    position: relative;
    display: grid !important;
    grid-template-columns: 50px minmax(0, 1fr) !important;
    grid-template-rows: minmax(0, 1fr) !important;
    flex: 1 1 auto;
    width: 100%; height: 100dvh; min-height: 0; overflow: hidden;
  }

  /* Sidebar: top logo cell and one continuous right-hand divider. */
  .sidebar {
    grid-column: 1 !important; grid-row: 1 !important;
    position: relative !important; top: auto !important; align-self: stretch !important;
    display: flex !important; flex-direction: column !important; align-items: center !important;
    gap: 0 !important; width: 50px !important; height: 100dvh !important;
    max-height: 100dvh !important; min-height: 0 !important; margin: 0 !important;
    padding: 0 0 8px !important; overflow-x: hidden !important; overflow-y: auto !important;
    border-right: 1px solid #e5e9ec !important; background: #fff !important;
    box-sizing: border-box !important; scrollbar-width: none !important;
    -ms-overflow-style: none !important; z-index: 1001 !important;
  }
  .sidebar::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  .sidebar > * { flex-shrink: 0; }
  .sidebar .mobile-brand {
    display: flex !important; align-items: center !important; justify-content: center !important;
    flex: 0 0 52px !important; width: 100% !important; height: 52px !important; min-height: 52px !important;
    margin: 0 !important; padding: 0 !important; border: 0 !important;
    border-bottom: 1px solid #e9edef !important; border-radius: 0 !important;
    background: #fff !important; box-sizing: border-box !important; font-size: 0 !important;
    overflow: hidden !important; text-align: center !important;
  }
  .sidebar .mobile-brand img {
    display: block !important; flex: 0 0 auto !important;
    width: 38px !important; height: 38px !important; max-width: calc(100% - 6px) !important; max-height: 40px !important;
    object-fit: contain !important; object-position: 50% 50% !important;
    margin: 0 auto !important; padding: 0 !important; border: 0 !important;
  }
  .sidebar .mobile-nav {
    display: flex !important; flex: 0 0 auto !important; flex-direction: column !important;
    align-items: center !important; gap: 8px !important; width: 100% !important;
    margin: 0 !important; padding: 8px 0 !important; box-sizing: border-box !important;
  }
  .sidebar .mobile-nav button {
    display: grid !important; place-items: center !important; flex: 0 0 39px !important;
    width: 39px !important; height: 39px !important; margin: 0 !important; padding: 0 !important;
    border: 1px solid #edf0f4 !important; border-radius: 10px !important;
    background: #fff !important; color: #5887ed !important; font-size: 17px !important;
    box-shadow: 0 1px 2px #00000005 !important;
  }
  .sidebar .mobile-nav button svg {
    display: block !important; width: 20px !important; height: 20px !important;
    fill: none !important; stroke: currentColor !important; stroke-width: 1.8 !important;
    stroke-linecap: round !important; stroke-linejoin: round !important;
    pointer-events: none !important;
  }
  .sidebar > .logo, .sidebar > .navbtn, .sidebar > .navspacer, .sidebar > .avatar { display: none !important; }

  /* Fixed header starts exactly at the sidebar's right edge. */
  .mobile-toolbar {
    position: fixed !important; z-index: 1000 !important; top: 0 !important;
    left: 50px !important; right: 0 !important; width: calc(100% - 50px) !important;
    height: 52px !important; min-height: 52px !important; display: flex !important;
    align-items: center !important; flex-wrap: nowrap !important; gap: 8px !important;
    margin: 0 !important; padding: 6px 8px !important; border: 0 !important;
    border-bottom: 1px solid #e9edef !important; border-radius: 0 !important;
    background: #fff !important; box-sizing: border-box !important;
  }
  .mobile-toolbar::before { display: none !important; content: none !important; }
  .mobile-toolbar button, .mobile-toolbar input {
    flex-shrink: 1; min-width: 0 !important; height: 36px !important; margin: 0 !important;
    border: 1px solid #e7e9e9 !important; border-radius: 8px !important;
    background: #fff !important; color: #333 !important; box-sizing: border-box !important;
    font-size: 12px !important;
  }
  .mobile-toolbar .mobile-bluetooth { flex: 0 0 34px !important; width: 34px !important; padding: 0 !important; color: #e65a73 !important; }
  .mobile-toolbar .mobile-shift { flex: 0 0 84px !important; width: 84px !important; padding: 0 8px !important; font-weight: 600 !important; white-space: nowrap !important; }
  .mobile-toolbar #mobileSearch, .mobile-toolbar #mobileBarcode { flex: 1 1 0 !important; width: 0 !important; padding: 0 10px !important; }

  .main {
    grid-column: 2 !important; grid-row: 1 !important; display: block !important;
    width: 100%; min-width: 0 !important; height: 100dvh !important;
    margin: 0 !important; padding: 62px 8px 8px !important;
    overflow-x: hidden !important; overflow-y: auto !important; box-sizing: border-box !important;
  }
  .mainhead, .categories, .order { display: none !important; }

  /* Four compact stock cards per row. */
  .products {
    display: grid !important; width: 100% !important;
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    grid-auto-rows: max-content !important; align-content: start !important; align-items: stretch !important;
    gap: 7px !important; margin: 0 !important; padding: 0 0 8px !important;
    overflow: visible !important; box-sizing: border-box !important;
  }
  .product {
    display: flex !important; flex-direction: column !important; width: 100% !important;
    min-width: 0 !important; height: auto !important; margin: 0 !important; padding: 6px !important;
    border: 1px solid #dce5ee !important; border-radius: 10px !important;
    background: #fff !important; box-shadow: none !important; box-sizing: border-box !important;
    overflow: hidden !important;
  }
  .productpic {
    display: grid !important; place-items: center !important; flex: 0 0 auto !important;
    width: 100% !important; height: clamp(70px, 14vh, 96px) !important; border: 0 !important;
    border-radius: 8px !important; background: #fff !important; overflow: hidden !important;
  }
  .productpic::after { display: none !important; }
  .sushi { font-size: clamp(34px, 6vh, 48px) !important; line-height: 1 !important; transform: none !important; }
  .productbody {
    display: flex !important; flex: 1 1 auto !important; flex-direction: column !important;
    gap: 4px !important; width: 100% !important; min-width: 0 !important;
    padding: 4px 1px 1px !important; box-sizing: border-box !important;
  }
  .productname {
    display: block !important; width: 100% !important; min-width: 0 !important;
    min-height: 13px !important; margin: 0 !important; font-size: 9px !important;
    line-height: 1.25 !important; font-weight: 700 !important; white-space: nowrap !important;
    overflow: hidden !important; text-overflow: ellipsis !important;
  }
  .productmeta, .add { display: none !important; }
  .inventory-state {
    display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 4px !important; width: 100% !important;
  }
  .inventory-state span, .inventory-price span {
    display: block !important; width: 100% !important; min-width: 0 !important; padding: 4px !important;
    border: 1px solid #b9eacb !important; border-radius: 7px !important;
    font-size: 7px !important; line-height: 1.25 !important; box-sizing: border-box !important;
    overflow-wrap: anywhere !important;

  .inventory-state span:last-child { background: #effbf3 !important; border-color: #b9eacb !important; }
  .inventory-state b, .inventory-price b {
    display: block !important; margin-top: 3px !important; font-size: 8px !important;
    line-height: 1.15 !important; font-weight: 600 !important;
  }
  .inventory-state span:first-child b { color: #e05d13 !important; }
  .inventory-state span:last-child b { color: #078b6d !important; }

  .inventory-price span { background: #eff6ff !important; border-color: #c8ddff !important; color: #8293a9 !important; }
  .inventory-price b { color: #1756c7 !important; }
  .inventory-price.sell span { background: #effbf3 !important; border-color: #bcebc9 !important; }
  .inventory-price.sell b { color: #07936c !important; }
}

/* Narrow landscape phones: compact controls and cards without changing desktop. */
@media screen and (orientation: landscape) and (max-width: 600px) {
  .app { grid-template-columns: 44px minmax(0, 1fr) !important; }
  .sidebar { width: 44px !important; }
  .sidebar .mobile-brand { flex-basis: 48px !important; height: 48px !important; min-height: 48px !important; }
  .sidebar .mobile-brand img { width: 34px !important; height: 34px !important; max-height: 34px !important; }
  .sidebar .mobile-nav button { flex-basis: 35px !important; width: 35px !important; height: 35px !important; }
  .mobile-toolbar { left: 44px !important; width: calc(100% - 44px) !important; height: 48px !important; min-height: 48px !important; gap: 5px !important; padding: 5px !important; }
  .mobile-toolbar .mobile-bluetooth { flex-basis: 30px !important; width: 30px !important; }
  .mobile-toolbar .mobile-shift { flex-basis: 62px !important; width: 62px !important; }

  .products { gap: 5px !important; }
  .product { padding: 4px !important; }

/* Mobile landscape cart drawer — screenshot-matched item rows and fixed footer. */
.cart-drawer-backdrop { display:none; }
.cart-fab { display:none; }
.cart-drawer-actions { display:none; }
@media screen and (orientation:landscape) and (max-width:1100px) {
  .cart-fab {

    z-index:1090; display:grid; place-items:center; width:58px; height:58px; padding:0;

  .cart-item-photo {
    display:grid; place-items:center; flex:0 0 43px; width:43px; height:34px; overflow:hidden;
    border:4px solid #080808; border-radius:9px; background:#fff; box-sizing:border-box;
  }
  .cart-item-photo .sushi { display:block; font-size:21px; line-height:1; transform:none; filter:none; }
  .cart-item-photo img { display:block; width:100%; height:100%; object-fit:contain; }
  .cart-item-info { display:flex; flex:1 1 auto; flex-direction:column; justify-content:center; gap:2px; min-width:0; }
  .cart-item-name { color:#101214; font-size:10px; line-height:1.25; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cart-item-unit { color:#222; font-size:8px; line-height:1.25; white-space:nowrap; }
  .cart-item-total { flex:0 0 auto; max-width:34%; padding-left:3px; color:#111; font-size:8px; line-height:1.25; text-align:right; white-space:nowrap; }
  .order.cart-drawer-panel .cartitems .empty { padding:26px 8px; font-size:11px; }
  .order.cart-drawer-panel .summary {
    flex:0 0 auto; max-height:none; overflow:visible; margin:0; padding:6px 13px 5px;
    border-top:1px solid #e9edf1; background:#fff;
  }
  .order.cart-drawer-panel .summary .sumrow:not(.total),
  .order.cart-drawer-panel .summary .promo,
  .order.cart-drawer-panel .summary .payment,
  .order.cart-drawer-panel .summary .placeorder { display:none !important; }
  .order.cart-drawer-panel .summary .sumrow.total {
    display:flex; align-items:center; justify-content:space-between; margin:0; padding:0;
    color:#171b19; font-size:11px; font-weight:700;
  }
  .order.cart-drawer-panel .summary .sumrow.total span:last-child { font-size:12px; color:#111; }
  .cart-drawer-actions {
    display:flex !important; flex:0 0 auto; gap:8px; padding:7px 13px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid #edf1f5; background:#fff; position:relative; z-index:1;
  }
  .cart-drawer-actions button {
    min-height:36px; flex:1 1 0; border:1px solid #2563eb; border-radius:8px;
    font:600 12px/1.2 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    cursor:pointer; transition:background .18s ease, transform .18s ease;
  }
  .cart-drawer-save { background:#2563eb; color:#fff; }
  .cart-drawer-save:hover { background:#1d4ed8; }
  .cart-drawer-cancel { background:#eff6ff; color:#1d4ed8; }
  .cart-drawer-cancel:hover { background:#dbeafe; }
  .cart-drawer-actions button:active { transform:scale(.98); }
  body.cart-drawer-body-open { overflow:hidden !important; }
  .products .product { cursor:pointer; -webkit-tap-highlight-color:transparent; }
}
@media screen and (orientation:landscape) and (max-width:600px) {
  .cart-fab { width:52px; height:52px; right:max(11px, env(safe-area-inset-right)); bottom:max(11px, env(safe-area-inset-bottom)); }
  .cart-fab svg { width:24px; height:24px; }
  .order.cart-drawer-panel { width:min(355px, calc(100vw - 44px)) !important; }
  .order.cart-drawer-panel .orderhead { min-height:35px; padding:7px 10px 6px; }
  .order.cart-drawer-panel .orderhead h2::after { font-size:12px; }
  .order.cart-drawer-panel .cartitems { padding-left:10px; padding-right:10px; }
  .order.cart-drawer-panel .cartitem.cartitem-compact { min-height:46px; }
  .cart-item-photo { flex-basis:43px; width:43px; height:34px; }
  .order.cart-drawer-panel .summary { padding:6px 10px 5px; }
  .cart-drawer-actions { padding:7px 10px calc(7px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion:reduce) {
  .cart-fab, .cart-drawer-backdrop, .order.cart-drawer-panel { transition:none !important; }
}

</style>
</head>
<body>
<div class="stage">
 <div class="browser">
  <div class="browserbar"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i><span class="browsericon">▣</span><span style="margin-left:8px">‹</span><span>›</span><div class="address">♙ https://sushiban/dashboard/order.com</div><span>⟳</span><span>⇧</span><span>＋</span><span>▢</span></div>
  <div class="app">
   <aside class="sidebar">
    <div class="mobile-brand"><img src="https://raw.githubusercontent.com/rekapinyu/www.rekapinyu.web.id/main/Galery/Logo%20Mobile.png" alt="Logo Rekapinyu" /></div>
    <div class="mobile-nav">
      <button title="Kasir" aria-label="Kasir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M6.5 9V5.5A1.5 1.5 0 0 1 8 4h8a1.5 1.5 0 0 1 1.5 1.5V9M6.5 13h4v3h-4zM14 13h3M14 16h3M7 20v1M17 20v1"/></svg>
      </button>
      <button title="Produk Kasir" aria-label="Produk Kasir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8.5 4.3v9.4L12 21l-8.5-4.3V7.3L12 3Z"/><path d="m3.8 7.4 8.2 4.3 8.2-4.3M12 11.7V21M7 13.7v3.2M9 14.7v3.2M11 15.3v2.6M14.5 14.4h2.8M14.5 17h2.8"/></svg>
      </button>
      <button title="Laporan Kasir" aria-label="Laporan Kasir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4V21H6a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/><path d="M14 3.5v4h4M8 17v-3M11.5 17v-6M15 17v-4M8 10h2"/></svg>
      </button>
      <button title="Pengaturan" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.1.9-1.5 2.6-1.4-.6a7.9 7.9 0 0 1-1.7 1l-.2 1.5h-3l-.3-1.5a7.9 7.9 0 0 1-1.7-1l-1.4.6-1.5-2.6 1.1-.9a7.5 7.5 0 0 1 0-2l-1.1-.9 1.5-2.6 1.4.6a7.9 7.9 0 0 1 1.7-1l.3-1.5h3l.2 1.5a7.9 7.9 0 0 1 1.7 1l1.4-.6 1.5 2.6-1.1.9a7.5 7.5 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"/></svg>
      </button>
    </div>
    <div class="logo">🍣</div>
    <button class="navbtn" title="Home">⌂</button><button class="navbtn active" title="Products">▦</button><button class="navbtn" title="Orders">▤</button><button class="navbtn" title="Customers">♧</button><button class="navbtn" title="Inventory">⬡</button><button class="navbtn" title="Reports">▥</button>
    <div class="navspacer"></div><button class="navbtn" title="Notifications">♟</button><button class="navbtn" title="Settings">⚙</button><div class="avatar">👩🏻</div>
   </aside>
   <main class="main">
    <div class="mobile-toolbar"><button class="mobile-bluetooth" title="Bluetooth">ᛒ</button><button class="mobile-shift" id="shiftMobile">SHIFT</button><input id="mobileSearch" placeholder="cari produk" aria-label="Cari produk"><input id="mobileBarcode" placeholder="barcode" aria-label="Barcode"></div>
    <div class="mainhead"><h1>Time to Sushi!</h1><div class="searchrow"><input class="search" id="search" placeholder="⌕  Search sushi..." aria-label="Search products"><button class="filter" id="filterBtn">▽ &nbsp;Filter</button></div></div>
    <div class="categories" id="categories"></div>
    <div class="products" id="products"></div>
   </main>
   <aside class="order cart-drawer-panel" id="cartDrawer">
    <div class="orderhead"><h2>Order Details</h2><button class="more" title="More options">···</button></div>
    <div class="orderselectors"><select aria-label="Order type"><option>Dine In</option><option>Take Away</option><option>Delivery</option></select><select aria-label="Table"><option>Table 21</option><option>Table 01</option><option>Table 02</option><option>Table 03</option><option>Table 04</option></select></div>
    <div class="itemshead"><strong>Items</strong><button class="clear" id="clear">▤ &nbsp;Clear All</button></div>
    <div class="cartitems" id="cart"></div>
    <div class="summary">
     <div class="sumrow"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
     <div class="sumrow"><span>Tax (10%)</span><span id="tax">$0.00</span></div>
     <div class="sumrow"><span>Discount</span><span id="discount">$0.00</span></div>
     <div class="sumrow total"><span>Total</span><span id="total">$0.00</span></div>
     <div class="promo"><input id="promo" placeholder="Enter promo code..."><button id="apply">Apply</button></div>
     <select class="payment" id="payment"><option value="">Select payment method</option><option>Cash</option><option>Credit / Debit Card</option><option>E-Wallet</option></select>
     <button class="placeorder" id="place">Place Order</button>
    </div>
    <div class="cart-drawer-actions" aria-label="Aksi keranjang">
     <button type="button" id="cartCancelBtn" class="cart-drawer-cancel">Batalkan</button>
     <button type="button" id="cartSaveBtn" class="cart-drawer-save">Simpan</button>
    </div>
   </aside>
  </div>
 </div>
</div>
<div id="cartDrawerBackdrop" class="cart-drawer-backdrop" aria-hidden="true"></div>
<button id="cartFab" class="cart-fab" type="button" aria-label="Buka keranjang" aria-controls="cartDrawer" aria-expanded="false">
 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="19.2" r="1.3"/><circle cx="17.2" cy="19.2" r="1.3"/></svg>
 <span id="cartFabCount" class="cart-fab-count">0</span>
</button>
<div class="toast" id="toast"></div>
<script>
const categories=[
 {name:'Nigiri Sushi',icon:'🍣'},{name:'Maki Sushi',icon:'🍙'},{name:'Uramaki Sushi',icon:'🍘'},{name:'Gunkan Maki',icon:'🍱'},{name:'Temaki Sushi',icon:'🥗'},{name:'Oshi Sushi',icon:'🍣'},{name:'Chirashi Sushi',icon:'🍛'}
];
const products=[
 {id:1,name:'Salmori Sushi',category:'Nigiri Sushi',desc:'4 pcs/pack',price:10,icon:'🍣'},
 {id:2,name:'Nori Glaze Salmon Sushi',category:'Maki Sushi',desc:'6 pcs/pack',price:11,icon:'🍙'},
 {id:3,name:'Sweet Shrimp Sushi',category:'Nigiri Sushi',desc:'4 pcs/pack',price:12,icon:'🍤'},
 {id:4,name:'Umami Gyuniku Sushi',category:'Nigiri Sushi',desc:'2 pcs/pack',price:13.5,icon:'🍣'},
 {id:5,name:'Tamago Ikura Sushi',category:'Nigiri Sushi',desc:'4 pcs/pack',price:11.5,icon:'🍳'},
 {id:6,name:'Maguro Wasabi Sushi',category:'Nigiri Sushi',desc:'8 pcs/pack',price:12,icon:'🍣'},
 {id:7,name:'Nori Pop Sushi',category:'Gunkan Maki',desc:'4 pcs/pack',price:11,icon:'🍱'},
 {id:8,name:'Shrimp Wrap Sushi',category:'Maki Sushi',desc:'6 pcs/pack',price:12.5,icon:'🍤'},
 {id:9,name:'Avocado Maki',category:'Maki Sushi',desc:'6 pcs/pack',price:9.5,icon:'🥑'},
 {id:10,name:'Salmon Roll',category:'Uramaki Sushi',desc:'6 pcs/pack',price:13,icon:'🍥'},
 {id:11,name:'Tuna Temaki',category:'Temaki Sushi',desc:'2 pcs/pack',price:10.5,icon:'🌮'},
 {id:12,name:'Oshi Salmon',category:'Oshi Sushi',desc:'4 pcs/pack',price:14,icon:'🍣'},
 {id:13,name:'Chirashi Bowl',category:'Chirashi Sushi',desc:'1 bowl',price:16,icon:'🍚'},
 {id:14,name:'Salmon Ikura',category:'Gunkan Maki',desc:'4 pcs/pack',price:12.5,icon:'🍱'}
];
let activeCategory='Nigiri Sushi',cart=new Map(),discount=0;
const money=n=>'$'+n.toFixed(2);
function renderCategories(){document.getElementById('categories').innerHTML=categories.map(c=>`<button class="category ${activeCategory===c.name?'active':''}" data-cat="${c.name}"><span class="food">${c.icon}</span><span>${c.name}</span></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();renderProducts()})}
function renderProducts(){let q=(document.getElementById('mobileSearch')?.value||document.getElementById('search').value).toLowerCase();let filtered=products.filter(p=>(activeCategory==='All'||p.category===activeCategory)&&p.name.toLowerCase().includes(q));if(!filtered.length)filtered=products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('products').innerHTML=filtered.map(p=>`<article class="product" data-product-card="${p.id}"><div class="productpic"><span class="sushi">${p.icon}</span></div><div class="productbody"><div class="productname" title="${p.name}">${p.name}</div><div class="inventory-state"><span>Stok Manual<br><b>${p.stockManual??90}</b></span><span>Stok Barcode<br><b>${p.stockBarcode??0}</b></span></div><div class="inventory-price"><span>Harga Beli<br><b>${money(p.cost??p.price*.8)}</b></span></div><div class="inventory-price sell"><span>Harga Jual<br><b>${money(p.price)}</b></span></div><button class="add" data-add="${p.id}">＋ &nbsp;Add to cart</button></div></article>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();addToCart(+b.dataset.add)});document.querySelectorAll('[data-product-card]').forEach(card=>card.addEventListener('click',e=>{if(e.target.closest('[data-add]'))return;if(window.matchMedia('(orientation: landscape) and (max-width: 1100px)').matches){addToCart(Number(card.dataset.productCard))}}))}
function addToCart(id){cart.set(id,(cart.get(id)||0)+1);renderCart();toast('Added to cart')}
function changeQty(id,delta){let n=(cart.get(id)||0)+delta;if(n<=0)cart.delete(id);else cart.set(id,n);renderCart()}
function renderCart(){
 const entries=[...cart.entries()];
 const compactDrawer=window.matchMedia('(orientation: landscape) and (max-width: 1100px)').matches;
 const rupiah=n=>'Rp. '+Math.round(n*1000).toLocaleString('id-ID');
 document.getElementById('cart').innerHTML=entries.length?entries.map(([id,qty])=>{
  const p=products.find(x=>x.id===id);
  if(compactDrawer){
   const photo=(p.photo||p.imageUrl||p.image)?`<img src="${p.photo||p.imageUrl||p.image}" alt="${p.name}">`:`<span class="sushi" aria-hidden="true">${p.icon}</span>`;
   return `<div class="cartitem cartitem-compact"><div class="cart-item-photo">${photo}</div><div class="cart-item-info"><div class="cart-item-name" title="${p.name}">${p.name}</div><div class="cart-item-unit">${qty} x ${rupiah(p.price)}</div></div><div class="cart-item-total">${rupiah(p.price*qty)}</div></div>`;
  }
  return `<div class="cartitem"><div class="carttop"><div class="cartpic">${p.icon}</div><div><div class="cartname">${p.name}</div><div class="cartdesc">${p.category}<br>${p.desc}</div></div></div><div class="cartbottom"><span class="cartprice">${money(p.price*qty)}</span><div class="qty"><button data-minus="${id}">−</button><span class="qtynum">${qty}</span><button class="plus" data-plus="${id}">＋</button></div></div></div>`;
 }).join(''):'<div class="empty">Your order is empty.<br>Add sushi to get started.</div>';
 document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(+b.dataset.minus,-1));
 document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(+b.dataset.plus,1));
 const subtotal=entries.reduce((sum,[id,qty])=>sum+products.find(p=>p.id===id).price*qty,0),tax=subtotal*.1,total=Math.max(0,subtotal+tax-discount);
 document.getElementById('subtotal').textContent=money(subtotal);
 document.getElementById('tax').textContent=money(tax);
 document.getElementById('discount').textContent=money(discount);
 document.getElementById('total').textContent=compactDrawer?rupiah(total):money(total);
 updateCartFabCount();
}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2200)}
document.getElementById('search').addEventListener('input',renderProducts);
document.getElementById('mobileSearch')?.addEventListener('input',renderProducts);
document.getElementById('clear').onclick=()=>{cart.clear();discount=0;renderCart();toast('Order cleared')};
document.getElementById('apply').onclick=()=>{let code=document.getElementById('promo').value.trim().toUpperCase();let subtotal=[...cart.entries()].reduce((s,[id,q])=>s+products.find(p=>p.id===id).price*q,0);if(code==='SUSHI10'&&subtotal>0){discount=subtotal*.1;renderCart();toast('10% discount applied')}else{discount=0;renderCart();toast('Use code SUSHI10 for 10% off')}};
document.getElementById('filterBtn').onclick=()=>{activeCategory=activeCategory==='All'?'Nigiri Sushi':'All';renderCategories();renderProducts();toast(activeCategory==='All'?'Showing all categories':'Showing Nigiri Sushi')};
document.getElementById('place').onclick=()=>{if(!cart.size){toast('Please add items to your order');return}if(!document.getElementById('payment').value){toast('Please select a payment method');return}toast('Order placed successfully!');cart.clear();discount=0;document.getElementById('promo').value='';renderCart()};
document.getElementById('mobileSearch').addEventListener('input',e=>{document.getElementById('search').value=e.target.value;renderProducts()});
document.getElementById('mobileBarcode').addEventListener('keydown',e=>{if(e.key==='Enter'){const p=products.find(x=>String(x.id)===e.target.value.trim());if(p){addToCart(p.id);e.target.value=''}else toast('Barcode tidak ditemukan')}});
document.getElementById('shiftMobile').onclick=()=>toast('SHIFT');

// Mobile cart drawer: preserve the cart snapshot until the user saves or cancels.
let cartDrawerSnapshot=null;
function updateCartFabCount(){
 const count=[...cart.values()].reduce((sum,qty)=>sum+qty,0);
 const badge=document.getElementById('cartFabCount');
 if(badge) badge.textContent=count>99?'99+':String(count);
}
function openCartDrawer(){
 const drawer=document.getElementById('cartDrawer');
 if(drawer.classList.contains('is-open')) return;
 cartDrawerSnapshot={cart:new Map(cart),discount,promo:document.getElementById('promo').value,payment:document.getElementById('payment').value};
 drawer.classList.add('is-open');
 document.getElementById('cartDrawerBackdrop').classList.add('is-open');
 document.getElementById('cartDrawerBackdrop').setAttribute('aria-hidden','false');
 document.getElementById('cartFab').setAttribute('aria-expanded','true');
 document.body.classList.add('cart-drawer-body-open');
}
function closeCartDrawer(){
 document.getElementById('cartDrawer').classList.remove('is-open');
 document.getElementById('cartDrawerBackdrop').classList.remove('is-open');
 document.getElementById('cartDrawerBackdrop').setAttribute('aria-hidden','true');
 document.getElementById('cartFab').setAttribute('aria-expanded','false');
 document.body.classList.remove('cart-drawer-body-open');
}
function saveCartDrawer(){
 cartDrawerSnapshot=null;
 closeCartDrawer();
 toast('Keranjang disimpan');
}
function cancelCartDrawer(){
 if(cartDrawerSnapshot){
  cart=new Map(cartDrawerSnapshot.cart);
  discount=cartDrawerSnapshot.discount;
  document.getElementById('promo').value=cartDrawerSnapshot.promo;
  document.getElementById('payment').value=cartDrawerSnapshot.payment;
  renderCart();
 }
 cartDrawerSnapshot=null;
 closeCartDrawer();
 toast('Perubahan keranjang dibatalkan');
}
document.getElementById('cartFab').addEventListener('click',openCartDrawer);
document.getElementById('cartSaveBtn').addEventListener('click',saveCartDrawer);
document.getElementById('cartCancelBtn').addEventListener('click',cancelCartDrawer);
document.getElementById('cartDrawerBackdrop').addEventListener('click',cancelCartDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('cartDrawer').classList.contains('is-open'))cancelCartDrawer()});
window.addEventListener('resize',()=>{renderCart()});

renderCategories();renderProducts();cart.set(6,1);cart.set(5,1);renderCart();
</script>
</body>
</html>
