<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mengarahkan Rekapinyu sesuai perangkat</title>
  <script>
    (function () {
      // Smartphone dan tablet/iPad diarahkan ke versi mobile.
      // Perangkat desktop/laptop diarahkan ke versi desktop.
      var ua = navigator.userAgent || "";
      var platform = navigator.platform || "";
      var isIPadOS = platform === "MacIntel" && navigator.maxTouchPoints > 1;
      var isTablet = /iPad|Tablet|PlayBook|Silk/i.test(ua) || isIPadOS;
      var isPhone = /Android.*Mobile|iPhone|iPod|Windows Phone|IEMobile|Opera Mini/i.test(ua);
      var isMobileDevice = isPhone || isTablet;

      var target = isMobileDevice ? "/mobile" : "/desktop";
      var fallbackText = isMobileDevice
        ? "Buka Rekapinyu versi mobile"
        : "Buka Rekapinyu versi desktop";

      window.location.replace(target);

      document.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("redirect-fallback");
        var message = document.getElementById("redirect-message");
        if (link) {
          link.href = target;
          link.textContent = fallbackText;
        }
        if (message) message.textContent = "Mengarahkan Anda ke Rekapinyu...";
      });
    })();
  </script>
</head>
<body>
  <main>
    <h1>Rekapinyu</h1>
    <p id="redirect-message">Mengarahkan Anda ke Rekapinyu...</p>
    <p>Jika halaman tidak berpindah otomatis, <a id="redirect-fallback" href="https://www.rekapinyu.web.id">klik di sini untuk membuka Rekapinyu</a>.</p>
  </main>
</body>
</html>
