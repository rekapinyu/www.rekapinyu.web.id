<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff}
#appFrame{display:block;width:100%;height:100%;height:100dvh;border:0;margin:0;padding:0;background:#fff}
</style>
<script>
(function(){
  function getTarget(){
    return window.matchMedia('(max-width: 760px)').matches ? 'mobile.html' : 'desktop.html';
  }
  function loadApp(){
    var frame=document.getElementById('appFrame');
    if(!frame)return;
    var target=getTarget();
    frame.dataset.currentTarget=target;
    frame.src=target;
  }
  window.addEventListener('DOMContentLoaded',function(){
    loadApp();
    var mq=window.matchMedia('(max-width: 760px)');
    if(mq.addEventListener){
      mq.addEventListener('change',loadApp);
    }else if(mq.addListener){
      mq.addListener(loadApp);
    }
  });
})();
</script>
</head>
<body>
<iframe id="appFrame" title="Rekapinyu" allow="camera; microphone; geolocation; clipboard-read; clipboard-write" allowfullscreen></iframe>
</body>
