<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Rekapinyu</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff}
#appFrame{display:block;width:100%;height:100%;height:100dvh;border:0;margin:0;padding:0;background:#fff}
</style>
<script>
(function(){
  var mq=window.matchMedia('(max-width: 760px)');
  function target(){return mq.matches?'mobile.html':'dekstop.html'}
  window.addEventListener('DOMContentLoaded',function(){
    var f=document.getElementById('appFrame');
    if(f){f.src=target();f.dataset.currentTarget=target()}
  });
  function change(){
    var f=document.getElementById('appFrame'), t=target();
    if(f&&f.dataset.currentTarget!==t){f.dataset.currentTarget=t;f.src=t}
  }
  if(mq.addEventListener)mq.addEventListener('change',change);else if(mq.addListener)mq.addListener(change);
})();
</script>
</head>
<body>
<iframe id="appFrame" title="Rekapinyu" allow="camera; microphone; geolocation; clipboard-read; clipboard-write" allowfullscreen></iframe>
</body>
</html>
