<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,follow">
  <title>Rekapinyu</title>
  <script>
  (function () {
    "use strict";

    var APP_SESSION_KEY = "finance_active_session";
    var LOGIN_URL = "/login";
    var DESKTOP_URL = "/desktop.html";
    var MOBILE_URL = "/mobile.html";

    function isMobileDevice() {
      return window.matchMedia("(max-width: 760px)").matches;
    }

    function hasValidLocalSession() {
      try {
        var raw = window.localStorage.getItem(APP_SESSION_KEY);
        if (!raw) return false;
        var session = JSON.parse(raw);
        return !!(session && typeof session === "object" && (session.uid || session.phone));
      } catch (_) {
        return false;
      }
    }

    var destination = hasValidLocalSession()
      ? (isMobileDevice() ? MOBILE_URL : DESKTOP_URL)
      : LOGIN_URL;

    window.location.replace(destination);
  })();
  </script>
</head>
<body>
  <noscript>
    <p>Rekapinyu memerlukan JavaScript untuk mengarahkan Anda ke halaman yang sesuai.</p>
    <p><a href="/login">Buka halaman login Rekapinyu</a></p>
  </noscript>
</body>
</html>
